minimumReleaseAge: 7200
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
trustPolicyExclude:
  - "tinyexec@1.2.2"
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
allowBuilds:
  esbuild: true
  prisma: true
