packages:
  - 'apps/api'
  - 'apps/workers/*'
  - 'packages/*'
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
catalog:
  '@cloudflare/workers-types': ^5.20260930.2
  '@vitest/coverage-v8': ^4.1.10
  fast-check: ^4.9.0
  hono: ^4.13.1
  jose: ^6.2.9
  typescript: ^6.0.3
  vitest: ^4.1.10
  wrangler: ^4.145.0
  zod: ^4.4.3
allowBuilds:
  "@mateo/icons@git+https://github.com/Ventairy/mateo.git": true
  "@nestjs/core": false
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  prisma: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - neon@4.4.0
  - '@cloudflare/workerd-darwin-64@1.20260930.2'
  - '@cloudflare/workerd-darwin-arm64@1.20260930.2'
  - '@cloudflare/workerd-linux-64@1.20260930.2'
  - '@cloudflare/workerd-linux-arm64@1.20260930.2'
  - '@cloudflare/workerd-windows-64@1.20260930.2'
  - miniflare@5.20260930.0-alpha
  - workerd@1.20260930.2
  - wrangler@4.145.0
  - '@cloudflare/workers-types@5.20260930.2'
  - '@cloudflare/vitest-plugin@1.3.4'
# Some upstream ranges still resolve vulnerable transitive versions.
# Keep these centralized pins until their upstream dependency ranges include the patched releases.
overrides:
  brace-expansion: 5.0.9
  'fast-uri@<4': 3.1.5
  'js-yaml@<5': 4.3.1
  undici: 6.28.0
