# Run from this directory with cargo-deny 0.20.2: cargo deny --locked check
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"

[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "Zlib"]

[licenses.private]
ignore = true

[bans]
# Multiple versions are not by themselves a policy violation.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
