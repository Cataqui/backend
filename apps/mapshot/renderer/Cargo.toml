[package]
name = "mapshot-renderer"
version = "0.1.0"
edition = "2024"
license-file = "../../../LICENSE"
publish = false

[dependencies]
libblur = "=0.24.0"
base64 = "0.22.1"
csscolorparser = "0.8.1"
libc = "0.2.190"
prost = "0.14.4"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
skrifa = { version = "0.48.0", default-features = false, features = ["std"] }
tiny-skia = "0.12.0"
unicode-bidi = "0.3.18"
unicode-script = "0.5.7"
unicode-segmentation = "1.12"
libwebp-sys = "0.14.4"
harfrust = "0.14.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
