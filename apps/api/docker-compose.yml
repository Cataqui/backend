services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: runtime
    ports:
      - "3000:3000"
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
