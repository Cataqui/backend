services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: runtime
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      ENVIRONMENT: ${ENVIRONMENT}
      PORT: "3000"
      HOST: 0.0.0.0
      DATABASE_APP_POOLER_URL: ${DATABASE_APP_POOLER_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      AI_GATEWAY_API_TOKEN: ${AI_GATEWAY_API_TOKEN}
      DERIVE_JOB_DATA_AI_GATEWAY_ID: ${DERIVE_JOB_DATA_AI_GATEWAY_ID}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
