name: Deploy Geoimage Worker
description: Deploy Geoimage immediately, verify health, and attempt restoration after failure.

inputs:
  environment:
    description: Deployment environment; staging or production.
    required: true

runs:
  using: composite
  steps:
    - name: Deploy Geoimage version
      shell: bash
      working-directory: ${{ github.workspace }}/apps/workers/geoimage
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        case "$INPUT_ENVIRONMENT" in staging | production) ;; *) exit 1 ;; esac
        umask 077
        secrets_file="$RUNNER_TEMP/geoimage-secrets.json"
        deployments_file="$RUNNER_TEMP/geoimage-deployments.json"
        command_log="$RUNNER_TEMP/geoimage-deploy.log"
        cleanup() { rm -f -- "$secrets_file" "$deployments_file" "$command_log"; }
        trap cleanup EXIT
        node - "$secrets_file" <<'NODE'
        const { writeFileSync } = require("node:fs");
        if (!process.env.GEOAPIFY_API_KEY) process.exit(1);
        writeFileSync(process.argv[2], JSON.stringify({ GEOAPIFY_API_KEY: process.env.GEOAPIFY_API_KEY }), { mode: 0o600 });
        NODE
        worker_name="cataqui-geoimage-$INPUT_ENVIRONMENT"
        base_url="https://geoimage.cataqui.com"
        [[ "$INPUT_ENVIRONMENT" == staging ]] && base_url="https://staging.geoimage.cataqui.com"
        jwks_url="$(jq -er --arg environment "$INPUT_ENVIRONMENT" '.env[$environment].vars.MICROSERVICES_AUTH_JWKS_URL' wrangler.jsonc)"
        if ! JWKS_URL="$jwks_url" node --input-type=module <<'NODE'
        import { MicroservicesAuthJwksOutputSchema } from "@cataqui/microservices-auth-schemas/jwks";
        try {
          const response = await fetch(process.env.JWKS_URL, { signal: AbortSignal.timeout(5000) });
          if (!response.ok || !MicroservicesAuthJwksOutputSchema.safeParse(await response.json()).success) process.exit(1);
        } catch { process.exit(1); }
        NODE
        then
          echo "Geoimage requires a healthy API JWKS endpoint before deployment." >&2; exit 1;
        fi
        account_id="$(jq -er '.account_id' wrangler.jsonc)"
        worker_exists="$(WORKER_NAME="$worker_name" CLOUDFLARE_ACCOUNT_ID="$account_id" node --input-type=module <<'NODE'
        try {
          const { CLOUDFLARE_ACCOUNT_ID: accountId, CLOUDFLARE_API_TOKEN: token, WORKER_NAME: workerName } = process.env;
          if (!token) process.exit(1);
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/scripts`, {
            headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(10000),
          });
          if (!response.ok) process.exit(1);
          const body = await response.json();
          if (body.success !== true || !Array.isArray(body.result) || !body.result.every((worker) => typeof worker.id === "string")) process.exit(1);
          const matches = body.result.filter((worker) => worker.id === workerName);
          if (matches.length > 1) process.exit(1);
          process.stdout.write(matches.length === 1 ? "true" : "false");
        } catch { process.exit(1); }
        NODE
        )" || { echo "Geoimage Worker lookup failed; deployment stopped." >&2; exit 1; }
        previous_version=""
        if [[ "$worker_exists" == true ]]; then
          pnpm exec wrangler deployments list --config wrangler.jsonc --env "$INPUT_ENVIRONMENT" --json >"$deployments_file" 2>"$command_log" || {
            echo "Geoimage deployment lookup failed; deployment stopped." >&2; exit 1;
          }
          previous_version="$(node - "$deployments_file" <<'NODE'
          const { readFileSync } = require("node:fs");
          try {
            const deployments = JSON.parse(readFileSync(process.argv[2], "utf8"));
            if (!Array.isArray(deployments) || !Array.isArray(deployments.at(-1)?.versions)) process.exit(1);
            const versions = deployments.at(-1).versions;
            if (versions.length !== 1 || versions[0].percentage !== 100 || typeof versions[0].version_id !== "string") process.exit(1);
            process.stdout.write(versions[0].version_id);
          } catch { process.exit(1); }
        NODE
          )" || { echo "Geoimage has no single fully active version to restore; resolve its deployment before retrying." >&2; exit 1; }
        fi
        restore() {
          if [[ -z "$previous_version" ]]; then
            echo "No previous Geoimage version exists; resolve the failed first deployment before retrying." >&2
            return 1
          fi
          if ! pnpm exec wrangler versions deploy "$previous_version@100%" --config wrangler.jsonc \
            --env "$INPUT_ENVIRONMENT" --message "Automatic rollback after failed $GITHUB_SHA" --yes >"$command_log" 2>&1; then
            echo "Geoimage rollback failed or is unavailable after a Durable Object lifecycle change; inspect the deployment and recover forward." >&2
            return 1
          fi
          echo "Previous Geoimage version restored; verify public health before retrying." >&2
        }
        if ! pnpm exec wrangler deploy --config wrangler.jsonc --env "$INPUT_ENVIRONMENT" \
          --strict --tag "$GITHUB_SHA" --message "Deploy $GITHUB_SHA" --secrets-file "$secrets_file" >"$command_log" 2>&1; then
          echo "Geoimage deployment failed; raw output is withheld." >&2
          restore || true
          exit 1
        fi
        successes=0
        failures=0
        last_status=000
        for attempt in $(seq 1 40); do
          last_status="$(curl --silent --connect-timeout 5 --max-time 10 --output /dev/null --write-out '%{http_code}' "$base_url/v1/health" || true)"
          if [[ "$last_status" == 204 ]]; then
            successes=$((successes+1))
            failures=0
            if [[ "$successes" -ge 3 ]]; then exit 0; fi
          else
            successes=0
            failures=$((failures+1))
            if [[ -n "$previous_version" && "$failures" -ge 3 ]]; then break; fi
          fi
          if [[ "$attempt" -lt 40 ]]; then sleep 15; fi
        done
        echo "Geoimage failed post-deployment health verification with HTTP $last_status." >&2
        restore || true
        exit 1
