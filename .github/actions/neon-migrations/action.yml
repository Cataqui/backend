name: Neon migration safety gate
description: Validate application-owned Prisma migrations on an expiring Neon branch, then apply them once to main.

inputs:
  infisical-identity-id:
    description: Environment-scoped Infisical deployment identity supplied by the workflow.
    required: true
  environment:
    description: Deployment environment; staging or production.
    required: true

  application:
    description: Database owner; api or auth.
    required: false
    default: api

runs:
  using: composite
  steps:
    - name: Load migration values
      uses: ./.github/actions/load-infisical-secrets
      with:
        environment: ${{ inputs.environment }}
        profile: ${{ inputs.application }}-deployment
        infisical-identity-id: ${{ inputs.infisical-identity-id }}
    - name: Clear API deployment credential during migration
      shell: ruby {0}
      run: File.open(ENV.fetch("GITHUB_ENV"), "a") { |file| file.puts("CLOUDFLARE_API_TOKEN=") }
    - name: Load application runtime for migration validation
      uses: ./.github/actions/load-infisical-secrets
      with:
        environment: ${{ inputs.environment }}
        profile: ${{ inputs.application }}-runtime
        infisical-identity-id: ${{ inputs.infisical-identity-id }}
    - name: Resolve Cloudflare account ID
      shell: ruby {0}
      run: |
        require "json"
        account_id = JSON.parse(File.read("infrastructure/platforms.json", encoding: "UTF-8")).fetch("cloudflare").fetch("account_id")
        File.open(ENV.fetch("GITHUB_ENV"), "a") { |file| file.puts("CLOUDFLARE_ACCOUNT_ID=#{account_id}") }
    - name: Get migration branch config
      id: branch-config
      shell: ruby {0}
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_APPLICATION: ${{ inputs.application }}
      run: |
        require "json"
        require "time"
        abort("Unsupported migration environment.") unless %w[staging production].include?(ENV.fetch("INPUT_ENVIRONMENT"))
        application = ENV.fetch("INPUT_APPLICATION")
        abort("Unsupported database owner.") unless %w[api auth].include?(application)
        abort("Docker is required for API migration validation.") if application == "api" && !system("docker", "--version", out: File::NULL)
        database = JSON.parse(File.read("infrastructure/manifest.json", encoding: "UTF-8")).fetch("neon").fetch("databases").fetch(application == "api" ? "cataqui" : "auth")
        File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |file|
          file.puts("name=ci-migration-#{application}-#{ENV.fetch('GITHUB_RUN_ID')}-#{ENV.fetch('GITHUB_RUN_ATTEMPT')}")
          file.puts("database=#{database.fetch('name')}")
          file.puts("role=#{database.fetch('owner_role')}")
          file.puts("expires-at=#{(Time.now.utc + 24 * 60 * 60).iso8601(3)}")
        end
    - name: Mask inherited database password
      shell: ruby {0}
      run: |
        require "uri"
        begin
          password = URI.parse(ENV.fetch("DATABASE_OWNER_DIRECT_URL")).password
          abort("The migration database URL must contain a password.") if password.nil? || password.empty?
          decoded_password = URI.decode_uri_component(password)
          abort("The migration database password encoding is invalid.") unless decoded_password.valid_encoding?
        rescue URI::InvalidURIError, ArgumentError
          abort("The migration database URL is invalid.")
        end
        # The branch inherits its parent's role password; mask it before the action returns URLs.
        [password, decoded_password].each do |value|
          puts("::add-mask::#{value.gsub('%', '%25').gsub("\r", '%0D').gsub("\n", '%0A')}")
        end
    - name: Create expiring migration branch
      id: branch
      uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
      with:
        api_key: ${{ env.NEON_API_KEY }}
        project_id: ${{ env.NEON_PROJECT_ID }}
        branch_name: ${{ steps.branch-config.outputs.name }}
        parent_branch: main
        database: ${{ steps.branch-config.outputs.database }}
        role: ${{ steps.branch-config.outputs.role }}
        expires_at: ${{ steps.branch-config.outputs.expires-at }}
    - name: Apply migrations to temporary branch
      shell: ruby {0}
      env:
        INPUT_APPLICATION: ${{ inputs.application }}
        DATABASE_OWNER_DIRECT_URL: ${{ steps.branch.outputs.db_url }}
      run: load File.join(ENV.fetch("GITHUB_ACTION_PATH"), "apply-migrations.rb")
    - name: Build candidate API image
      if: inputs.application == 'api'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        DOCKER_BUILD_SUMMARY: 'false'
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        context: .
        file: apps/api/Dockerfile
        tags: cataqui-api-candidate:${{ github.sha }}
        load: true
    - name: Check API against migrated branch
      if: inputs.application == 'api'
      shell: ruby {0}
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        MIGRATION_BRANCH_URL: ${{ steps.branch.outputs.db_url }}
      run: load File.join(ENV.fetch("GITHUB_ACTION_PATH"), "check-api-on-migration-branch.rb")
    - name: Check Auth against migrated branch
      if: inputs.application == 'auth'
      shell: ruby {0}
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        MIGRATION_BRANCH_URL: ${{ steps.branch.outputs.db_url }}
      run: load File.join(ENV.fetch("GITHUB_ACTION_PATH"), "check-auth-on-migration-branch.rb")
    - name: Apply migrations to main database
      shell: ruby {0}
      env:
        INPUT_APPLICATION: ${{ inputs.application }}
        PGOPTIONS: -c lock_timeout=5s -c statement_timeout=300s
      run: load File.join(ENV.fetch("GITHUB_ACTION_PATH"), "apply-migrations.rb")
    - name: Delete migration branch
      if: always() && steps.branch-config.outcome == 'success' && steps.branch.outcome != 'skipped'
      continue-on-error: true
      uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
      with:
        api_key: ${{ env.NEON_API_KEY }}
        project_id: ${{ env.NEON_PROJECT_ID }}
        branch: ${{ steps.branch-config.outputs.name }}
    - name: Clear migration credentials
      if: always()
      shell: ruby {0}
      run: |
        names = %w[
          CLOUDFLARE_API_TOKEN DATABASE_OWNER_DIRECT_URL NEON_PROJECT_ID NEON_PROJECT_API_KEY NEON_API_KEY
          DATABASE_APP_POOLER_URL AI_GATEWAY_API_TOKEN UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN
          AUTH_REFRESH_TOKEN_HMAC_KEY_V1_BASE64URL WHATSAPP_AUTH_WEBHOOK_VERIFY_TOKEN META_APP_SECRET HYPERDRIVE_ID
        ]
        File.open(ENV.fetch("GITHUB_ENV"), "a") do |file|
          names.each { |name| file.puts("#{name}=") }
        end
