name: Deploy API container safely
description: Deploy the API Worker and Container, monitor health, and roll back its Worker version on failure.

inputs:
  infisical-identity-id:
    description: Environment-scoped Infisical deployment identity supplied by the workflow.
    required: true
  environment:
    description: Deployment environment; staging or production.
    required: true

runs:
  using: composite
  steps:
    - name: Load API deployment credentials
      uses: ./.github/actions/load-infisical-secrets
      with:
        environment: ${{ inputs.environment }}
        profile: api-deployment
        infisical-identity-id: ${{ inputs.infisical-identity-id }}
    - name: Load API runtime
      uses: ./.github/actions/load-infisical-secrets
      with:
        environment: ${{ inputs.environment }}
        profile: api-runtime
        infisical-identity-id: ${{ inputs.infisical-identity-id }}
    - name: Build API Worker for the deployment environment
      shell: ruby {0}
      working-directory: apps/api/worker
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
      run: exec "pnpm", "exec", "cf", "build", "--mode", ENV.fetch("INPUT_ENVIRONMENT")
    - name: Get current Worker version
      id: current-worker-version
      shell: ruby {0}
      working-directory: apps/api/worker
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        require "open3"
        require "rbconfig"
        require "json"
        previous_versions, status = Open3.capture2(
          RbConfig.ruby, File.join(ENV.fetch("GITHUB_WORKSPACE"), ".github/scripts/cloudflare/get-current-worker-deployment.rb")
        )
        exit(status.exitstatus || 1) unless status.success?
        versions = JSON.parse(previous_versions)
        abort "Resolve the partial API rollout before starting another deployment." if versions.length > 1
        File.open(ENV.fetch("GITHUB_OUTPUT"), "a") { |file| file.puts "versions=#{JSON.generate(versions)}" }
    - name: Get current container config
      id: current-container-config
      shell: ruby {0}
      working-directory: apps/api/worker
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        require "json"
        containers = Dir.glob(".cloudflare/output/v0/containers/*/container.config.json")
        abort "Expected the API's sole Container application." unless containers.length == 1
        container = JSON.parse(File.read(containers.first, encoding: "UTF-8"))
        rollout = container.fetch("maxInstances") == 1 ? "immediate" : "gradual"
        File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |file|
          file.puts "name=#{container.fetch('name')}"
          file.puts "rollout=#{rollout}"
        end
    - name: Deploy API Worker and Container
      id: deploy
      shell: ruby {0}
      working-directory: apps/api/worker
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_RUNTIME_PROFILE: api-runtime
        CONTAINERS_ROLLOUT: ${{ steps.current-container-config.outputs.rollout }}
      run: load File.join(ENV.fetch("GITHUB_WORKSPACE"), ".github/scripts/cloudflare/deploy-worker.rb")
    - name: Monitor container rollout and API health
      id: container-rollout
      shell: ruby {0}
      working-directory: apps/api/worker
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        CONTAINER_APP_NAME: ${{ steps.current-container-config.outputs.name }}
      run: load File.join(ENV.fetch("GITHUB_ACTION_PATH"), "monitor-container-rollout.rb")
    - name: Restore previous Worker version and check API health
      if: failure() && steps.current-worker-version.outcome == 'success' && steps.current-container-config.outcome == 'success' && (steps.deploy.outcome == 'failure' || steps.container-rollout.outcome == 'failure')
      shell: ruby {0}
      working-directory: apps/api/worker
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        PREVIOUS_VERSIONS: ${{ steps.current-worker-version.outputs.versions }}
      run: load File.join(ENV.fetch("GITHUB_ACTION_PATH"), "restore-worker-version.rb")
    - name: Remove API deployment logs
      if: always()
      shell: ruby {0}
      run: |
        %w[cataqui-api-deploy.log cataqui-api-containers.log].each do |name|
          begin
            File.delete(File.join(ENV.fetch("RUNNER_TEMP"), name))
          rescue Errno::ENOENT
            # A failed deployment may not have created either log.
          end
        end
    - name: Clear API credentials
      if: always()
      shell: ruby {0}
      run: |
        require "json"
        profiles = JSON.parse(File.read(".github/actions/load-infisical-secrets/profiles.json", encoding: "UTF-8"))
        names = %w[api-deployment api-runtime].flat_map do |name|
          profile = profiles.fetch(name)
          profile.fetch("required_secrets") + profile.fetch("environment_aliases").keys
        end
        File.open(ENV.fetch("GITHUB_ENV"), "a") do |file|
          names.uniq.each { |name| file.puts "#{name}=" }
        end
