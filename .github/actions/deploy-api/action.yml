name: Deploy API container safely
description: Deploy the API Worker and Container gradually, monitor health, and roll back its Worker version on failure.

inputs:
  environment:
    description: Deployment environment; staging or production.
    required: true

runs:
  using: composite
  steps:
    - name: Deploy and monitor API
      shell: bash
      working-directory: ${{ github.workspace }}/apps/api
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        case "$INPUT_ENVIRONMENT" in staging | production) ;; *) exit 1 ;; esac
        umask 077
        secrets_file="$RUNNER_TEMP/cataqui-api-secrets.json"
        deployment_file="$RUNNER_TEMP/cataqui-api-deployments.json"
        deploy_log="$RUNNER_TEMP/cataqui-api-deploy.log"
        container_log="$RUNNER_TEMP/cataqui-api-containers.log"
        cleanup() { rm -f -- "$secrets_file" "$deployment_file" "$deploy_log" "$container_log"; }
        trap cleanup EXIT

        node - "$secrets_file" <<'NODE'
        const { writeFileSync } = require("node:fs");
        const names = [
          "CLOUDFLARE_ACCOUNT_ID", "DATABASE_APP_POOLER_URL", "AI_GATEWAY_API_TOKEN",
          "UPSTASH_REDIS_REST_URL", "UPSTASH_REDIS_REST_TOKEN",
          "AUTH_REFRESH_TOKEN_HMAC_KEY_V1_BASE64URL", "MICROSERVICES_AUTH_JWT_PRIVATE_KEY_V1_PKCS8_BASE64",
        ];
        const values = Object.fromEntries(names.map((name) => [name, process.env[name]]));
        writeFileSync(process.argv[2], JSON.stringify(values), { mode: 0o600 });
        NODE

        pnpm exec wrangler deployments list --config wrangler.jsonc --env "$INPUT_ENVIRONMENT" --json >"$deployment_file" 2>/dev/null || true
        previous_version="$(node - "$deployment_file" <<'NODE'
        const { readFileSync } = require("node:fs");
        try {
          const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const deployments = Array.isArray(value) ? value : value.deployments ?? value.result ?? [];
          const versions = deployments[0]?.versions ?? deployments[0]?.strategy?.versions ?? [];
          const stable = versions.find((item) => Number(item.percentage ?? item.traffic ?? 100) === 100) ?? versions[0];
          process.stdout.write(stable?.version_id ?? stable?.id ?? "");
        } catch {}
        NODE
        )"

        rollback() {
          if [[ -z "$previous_version" ]]; then
            echo "API health failed during its first deployment; no prior Worker version exists to restore." >&2
            return 1
          fi
          pnpm exec wrangler rollback "$previous_version" --config wrangler.jsonc \
            --env "$INPUT_ENVIRONMENT" --message "Automatic rollback after failed $GITHUB_SHA" --yes \
            >"$deploy_log" 2>&1 || { echo "Automatic API rollback failed." >&2; return 1; }
          for attempt in $(seq 1 20); do
            if probe_api; then return 0; fi
            sleep 15
          done
          echo "API rollback completed but health did not recover." >&2
          return 1
        }

        base_url="https://api.cataqui.com"
        [[ "$INPUT_ENVIRONMENT" == staging ]] && base_url="https://staging.api.cataqui.com"
        worker_name="$(jq -er --arg environment "$INPUT_ENVIRONMENT" '.env[$environment].name // .name' wrangler.jsonc)"
        container_class="$(jq -er --arg environment "$INPUT_ENVIRONMENT" '.env[$environment].containers[0].class_name' wrangler.jsonc)"
        container_app_name="$(printf '%s-%s-%s' "$worker_name" "$container_class" "$INPUT_ENVIRONMENT" | tr '[:upper:] ' '[:lower:]-')"
        probe_api() {
          [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base_url/v1/health/live" || true)" == 204 ]] &&
          [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base_url/v1/health" || true)" == 200 ]] &&
          [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base_url/v1/auth/microservices/jwks" || true)" == 200 ]]
        }

        if ! pnpm exec wrangler deploy --config wrangler.jsonc --env "$INPUT_ENVIRONMENT" \
          --strict --containers-rollout gradual --tag "$GITHUB_SHA" --message "Deploy $GITHUB_SHA" \
          --secrets-file "$secrets_file" >"$deploy_log" 2>&1; then
          echo "API deployment command failed; raw output is withheld." >&2
          rollback || true
          exit 1
        fi

        failures=0
        successes=0
        maximum_attempts=80
        [[ "$INPUT_ENVIRONMENT" == staging ]] && maximum_attempts=40
        for attempt in $(seq 1 "$maximum_attempts"); do
          rollout_state=progressing
          if pnpm exec wrangler containers list --config wrangler.jsonc --env "$INPUT_ENVIRONMENT" --json \
            >"$container_log" 2>&1; then
            if ! rollout_state="$(node - "$container_log" "$container_app_name" <<'NODE'
              const { readFileSync } = require("node:fs");
              const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
              const applications = Array.isArray(value) ? value : value.result ?? value.applications ?? [];
              const matches = applications.filter((application) => application.name === process.argv[3]);
              if (matches.length !== 1) process.exit(1);
              const state = matches[0].state;
              if (state === "degraded" || state === "failed" || state === "error") process.stdout.write("failed");
              else if (state === "active" || state === "ready") process.stdout.write("completed");
              else if (state === "provisioning") process.stdout.write("progressing");
              else process.exit(1);
        NODE
            )"; then
              echo "Unable to identify the API Container rollout state." >&2
              rollback || true
              exit 1
            fi
            if [[ "$rollout_state" == failed ]]; then
              echo "Container rollout entered a terminal failure state." >&2
              rollback || true
              exit 1
            fi
          fi
          if probe_api; then
            failures=0
            if [[ "$rollout_state" == completed ]]; then successes=$((successes + 1)); else successes=0; fi
            [[ "$successes" -ge 5 ]] && exit 0
          else
            successes=0
            failures=$((failures + 1))
            if [[ "$failures" -ge 3 ]]; then echo "API failed three consecutive health probes." >&2; rollback || true; exit 1; fi
          fi
          sleep 15
        done
        echo "API rollout timed out before five consecutive readiness successes." >&2
        rollback || true
        exit 1
