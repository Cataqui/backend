name: Set up Infisical CLI
description: Install a checksum-verified official Infisical CLI release on the Linux GitHub runner

runs:
  using: composite
  steps:
    - name: Install the verified Infisical CLI release
      shell: bash
      env:
        INFISICAL_CLI_SHA256: c35cdd1c4908b3ea6c0773279f8ae6993f9ec03b5e2d4a7cdc2f38ce89eb33d0
        INFISICAL_CLI_VERSION: 0.43.114
      run: |
        set -euo pipefail

        if [[ "$RUNNER_OS" != "Linux" || "$RUNNER_ARCH" != "X64" ]]; then
          echo "The pinned Infisical CLI artifact supports only Linux X64 GitHub runners" >&2
          exit 1
        fi

        archive_path="$(mktemp "$RUNNER_TEMP/infisical-cli.XXXXXX")"
        installation_directory="$RUNNER_TEMP/infisical-cli-$INFISICAL_CLI_VERSION"
        trap 'rm -f -- "$archive_path"' EXIT

        curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
          --output "$archive_path" \
          "https://github.com/Infisical/cli/releases/download/v$INFISICAL_CLI_VERSION/cli_$INFISICAL_CLI_VERSION_linux_amd64.tar.gz"

        echo "$INFISICAL_CLI_SHA256  $archive_path" | sha256sum --check --status
        install -d -m 0755 "$installation_directory"
        tar -xzf "$archive_path" -C "$installation_directory" infisical
        chmod 0755 "$installation_directory/infisical"

        "$installation_directory/infisical" --version
        echo "$installation_directory" >> "$GITHUB_PATH"
