name: Deploy Maps Worker
description: Publish the Maps Worker, check health, and restore the previous deployment on failure.

inputs:
  environment:
    description: Deployment environment; staging or production.
    required: true

runs:
  using: composite
  steps:
    - name: Load Maps deployment credentials
      uses: ./.github/actions/load-infisical-secrets
      with:
        environment: ${{ inputs.environment }}
        profile: maps-deployment
        infisical-identity-id: ${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}
    - name: Load Maps runtime
      uses: ./.github/actions/load-infisical-secrets
      with:
        environment: ${{ inputs.environment }}
        profile: maps-runtime
        infisical-identity-id: ${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}
    - name: Build Maps for the deployment environment
      shell: ruby {0}
      working-directory: apps/workers/maps
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
      run: exec "pnpm", "exec", "cf", "build", "--mode", ENV.fetch("INPUT_ENVIRONMENT")
    - name: Get current Worker deployment
      id: current-deployment
      shell: ruby {0}
      working-directory: apps/workers/maps
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        require "open3"
        require "rbconfig"
        versions, status = Open3.capture2(
          RbConfig.ruby, File.join(ENV.fetch("GITHUB_WORKSPACE"), ".github/scripts/cloudflare/get-current-worker-deployment.rb")
        )
        exit(status.exitstatus || 1) unless status.success?
        File.open(ENV.fetch("GITHUB_OUTPUT"), "a") { |file| file.puts "versions=#{versions.strip}" }
    - name: Deploy Maps
      id: deploy
      shell: ruby {0}
      working-directory: apps/workers/maps
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_RUNTIME_PROFILE: maps-runtime
      run: load File.join(ENV.fetch("GITHUB_WORKSPACE"), ".github/scripts/cloudflare/deploy-worker.rb")
    - name: Verify Maps health
      id: health
      shell: ruby {0}
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
      run: load File.join(ENV.fetch("GITHUB_ACTION_PATH"), "check-maps-health.rb")
    - name: Restore previous Maps deployment
      id: restore
      if: failure() && steps.current-deployment.outcome == 'success' && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure') && steps.current-deployment.outputs.versions != '[]'
      shell: ruby {0}
      working-directory: apps/workers/maps
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        PREVIOUS_VERSIONS: ${{ steps.current-deployment.outputs.versions }}
      run: load File.join(ENV.fetch("GITHUB_WORKSPACE"), ".github/scripts/cloudflare/restore-worker-deployment.rb")
    - name: Check Maps health after restoration
      if: failure() && steps.restore.outcome == 'success'
      shell: ruby {0}
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
      run: load File.join(ENV.fetch("GITHUB_ACTION_PATH"), "check-maps-health.rb")
    - name: Report unavailable first-deployment rollback
      if: failure() && steps.current-deployment.outcome == 'success' && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure') && steps.current-deployment.outputs.versions == '[]'
      shell: ruby {0}
      run: warn "Maps deployment failed; no previous Worker deployment exists to restore."
    - name: Clear Maps credentials
      if: always()
      shell: ruby {0}
      run: |
        require "json"
        profiles = JSON.parse(File.read(".github/actions/load-infisical-secrets/profiles.json", encoding: "UTF-8"))
        names = %w[maps-deployment maps-runtime].flat_map do |name|
          profile = profiles.fetch(name)
          profile.fetch("required_secrets") + profile.fetch("environment_aliases").keys
        end
        File.open(ENV.fetch("GITHUB_ENV"), "a") do |file|
          names.uniq.each { |name| file.puts "#{name}=" }
        end
