name: Authenticate Google Cloud
description: Authenticate the current job to Google Cloud through GitHub OIDC and service-account impersonation.

inputs:
  environment:
    description: Cataquí infrastructure environment to authenticate as.
    required: true
  workload-identity-provider:
    description: Fully qualified Google Workload Identity Provider resource name.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve Google service account
      id: google-service-account
      shell: ruby {0}
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        require "json"

        environment = ENV.fetch("INPUT_ENVIRONMENT")
        abort("Unsupported environment: #{environment}") unless %w[staging production].include?(environment)

        manifest = JSON.parse(File.read(File.join(ENV.fetch("GITHUB_ACTION_PATH"), "../../../infrastructure/manifest.json"), encoding: "UTF-8"))
        project_id = manifest.dig("google_cloud", "projects", "cataqui_#{environment}", "id")
        service_account_id = manifest.dig("google_cloud", "github_auth", "service_accounts", "cataqui_backend_#{environment}")
        abort("Google Cloud project or service account is missing from the infrastructure manifest.") unless project_id && service_account_id
        File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |file|
          file.puts("email=#{service_account_id}@#{project_id}.iam.gserviceaccount.com")
        end
    - name: Authenticate to Google Cloud
      id: google-auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ steps.google-service-account.outputs.email }}
        audience: https://github.com/Cataqui
        token_format: access_token
        access_token_lifetime: 3600s
        create_credentials_file: true
        export_environment_variables: true
        cleanup_credentials: true

    - name: Export OpenTofu Google access token
      shell: ruby {0}
      env:
        GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
      run: |
        token = ENV.fetch("GOOGLE_ACCESS_TOKEN")
        abort("Google Cloud authentication did not return an access token.") if token.empty?
        abort("Google Cloud authentication returned an invalid access token.") if token.include?("\n") || token.include?("\r")
        puts("::add-mask::#{token}")
        File.open(ENV.fetch("GITHUB_ENV"), "a") do |file|
          file.puts("GOOGLE_OAUTH_ACCESS_TOKEN=#{token}")
        end
