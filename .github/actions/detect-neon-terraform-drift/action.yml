name: Detect Neon Terraform drift
description: Fail when a Neon database project differs from its Cataquí environment

inputs:
  environment:
    description: Cataquí database environment to inspect
    required: true
  terraform-api-token:
    description: HCP Terraform API token
    required: true
  neon-api-key:
    description: Neon organization API key
    required: true
  neon-organization-id:
    description: Neon organization that owns the database projects
    required: true

runs:
  using: composite
  steps:
    - name: Verify protected environment credentials are available
      shell: bash
      env:
        HCP_TERRAFORM_TOKEN: ${{ inputs.terraform-api-token }}
        NEON_API_KEY: ${{ inputs.neon-api-key }}
        NEON_ORGANIZATION_ID: ${{ inputs.neon-organization-id }}
      run: |
        set -euo pipefail

        if [[ -z "$HCP_TERRAFORM_TOKEN" || -z "$NEON_API_KEY" || -z "$NEON_ORGANIZATION_ID" ]]; then
          echo "TERRAFORM_API_TOKEN, NEON_API_KEY, and NEON_ORGANIZATION_ID must be available in the selected Infisical environment" >&2
          exit 1
        fi

    - name: Read the pinned Terraform version
      id: terraform-version
      shell: bash
      run: |
        terraform_version="$(tr -d '[:space:]' < infrastructure/neon/.terraform-version)"

        if [[ ! "$terraform_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "infrastructure/neon/.terraform-version must contain a semantic version such as 1.15.8" >&2
          exit 1
        fi

        echo "version=$terraform_version" >> "$GITHUB_OUTPUT"

    - name: Install Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: ${{ steps.terraform-version.outputs.version }}
        terraform_wrapper: false

    - name: Verify the drift target
      shell: bash
      env:
        TERRAFORM_TARGET_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if [[ "$TERRAFORM_ROOT" != "infrastructure/neon/database" || ! -f "$TERRAFORM_ROOT/versions.tf" ]]; then
          echo "TERRAFORM_ROOT must identify the Neon database Terraform root" >&2
          exit 1
        fi

        if [[ "$TERRAFORM_TARGET_ENVIRONMENT" != "staging" && "$TERRAFORM_TARGET_ENVIRONMENT" != "production" ]]; then
          echo "environment must be staging or production" >&2
          exit 1
        fi

    - name: Initialize Terraform and the HCP workspace
      shell: bash
      run: terraform init -input=false
      working-directory: ${{ env.TERRAFORM_ROOT }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.terraform-api-token }}

    - name: Fail when managed Neon infrastructure has drifted
      shell: bash
      working-directory: ${{ env.TERRAFORM_ROOT }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.terraform-api-token }}
        NEON_API_KEY: ${{ inputs.neon-api-key }}
        TF_VAR_neon_organization_id: ${{ inputs.neon-organization-id }}
      run: |
        set +e
        terraform plan -detailed-exitcode -input=false -lock-timeout=5m -no-color
        terraform_exit_code=$?
        set -e

        if [[ "$terraform_exit_code" -eq 2 ]]; then
          echo "### Neon database drift detected for $TF_VAR_environment" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        exit "$terraform_exit_code"
