name: Detect Cloudflare Terraform drift
description: Fail when one registered Cloudflare Terraform component differs from its persistent environment

inputs:
  component:
    description: Registered component name from infrastructure/cloudflare/components.json
    required: true
  environment:
    description: Persistent environment to inspect
    required: true
  terraform-api-token:
    description: HCP Terraform API token
    required: true
  cloudflare-read-api-token:
    description: Cloudflare API token with read access
    required: true

runs:
  using: composite
  steps:
    - name: Verify protected environment credentials are available
      shell: bash
      env:
        HCP_TERRAFORM_TOKEN: ${{ inputs.terraform-api-token }}
        CLOUDFLARE_READ_TOKEN: ${{ inputs.cloudflare-read-api-token }}
      run: |
        if [[ -z "$HCP_TERRAFORM_TOKEN" ]]; then
          echo "TERRAFORM_API_TOKEN must be available in the selected Infisical environment" >&2
          exit 1
        fi

        if [[ -z "$CLOUDFLARE_READ_TOKEN" ]]; then
          echo "CLOUDFLARE_TERRAFORM_READ_API_TOKEN must be available in the selected Infisical environment" >&2
          exit 1
        fi

    - name: Read the pinned Terraform version
      id: terraform-version
      shell: bash
      run: |
        terraform_version="$(tr -d '[:space:]' < infrastructure/cloudflare/.terraform-version)"

        if [[ ! "$terraform_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "infrastructure/cloudflare/.terraform-version must contain a semantic version such as 1.15.8" >&2
          exit 1
        fi

        echo "version=$terraform_version" >> "$GITHUB_OUTPUT"

    - name: Install Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: ${{ steps.terraform-version.outputs.version }}
        terraform_wrapper: false

    - name: Verify the drift target
      shell: bash
      env:
        TERRAFORM_COMPONENT: ${{ inputs.component }}
        TERRAFORM_TARGET_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if [[ ! "$TERRAFORM_COMPONENT" =~ ^[a-z0-9-]+$ || ! -f "$TERRAFORM_ROOT/versions.tf" ]]; then
          echo "component must identify a registered Terraform root under infrastructure/cloudflare" >&2
          exit 1
        fi

        if ! jq --exit-status --arg component "$TERRAFORM_COMPONENT" 'index($component) != null' infrastructure/cloudflare/components.json > /dev/null; then
          echo "component must be listed in infrastructure/cloudflare/components.json" >&2
          exit 1
        fi

        if [[ "$TERRAFORM_TARGET_ENVIRONMENT" != "staging" && "$TERRAFORM_TARGET_ENVIRONMENT" != "production" ]]; then
          echo "environment must be staging or production" >&2
          exit 1
        fi

    - name: Initialize Terraform and the HCP workspace
      shell: bash
      run: terraform init -input=false
      working-directory: ${{ env.TERRAFORM_ROOT }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.terraform-api-token }}

    - name: Fail when managed Cloudflare infrastructure has drifted
      shell: bash
      working-directory: ${{ env.TERRAFORM_ROOT }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-read-api-token }}
        TF_TOKEN_app_terraform_io: ${{ inputs.terraform-api-token }}
      run: |
        set +e
        terraform plan -detailed-exitcode -input=false -lock-timeout=5m -no-color
        terraform_exit_code=$?
        set -e

        if [[ "$terraform_exit_code" -eq 2 ]]; then
          echo "### Cloudflare ${{ inputs.component }} drift detected for $TF_VAR_environment" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        exit "$terraform_exit_code"
