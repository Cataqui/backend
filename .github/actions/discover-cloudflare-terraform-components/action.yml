name: Discover Cloudflare Terraform components
description: Validates the Cloudflare component registry and exposes its registered Terraform roots

outputs:
  components:
    description: Compact JSON array of registered Cloudflare Terraform components
    value: ${{ steps.registry.outputs.components }}

runs:
  using: composite
  steps:
    - name: Validate and expose the component registry
      id: registry
      shell: bash
      run: |
        components="$(jq --compact-output '
          if type != "array" or length == 0 or any(.[]; type != "string" or test("^[a-z0-9-]+$") | not) or (unique | length) != length
          then error("components.json must be a non-empty array of unique lowercase component names")
          else .
          end
        ' infra/cloudflare/components.json)"

        for component in $(jq --raw-output '.[]' infra/cloudflare/components.json); do
          if [[ ! -f "infra/cloudflare/$component/versions.tf" ]]; then
            echo "Registered Terraform component $component has no versions.tf root" >&2
            exit 1
          fi
        done

        echo "components=$components" >> "$GITHUB_OUTPUT"
