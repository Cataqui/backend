name: Deploy Cloudflare Geosearch Worker safely
description: Deploy the geosearch Worker, verify readiness, and roll back an unhealthy deployment

inputs:
  environment:
    description: Protected Cloudflare deployment environment
    required: true
  readiness-url:
    description: Public versioned geosearch readiness endpoint
    required: true
  cloudflare-api-token:
    description: Cloudflare deployment API token
    required: true
  google-places-api-key:
    description: Google Places API New key used only by the geosearch Worker
    required: true

runs:
  using: composite
  steps:
    - name: Verify the geosearch Worker deployment target
      shell: bash
      env:
        DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        READINESS_URL: ${{ inputs.readiness-url }}
      run: |
        set -euo pipefail

        case "$DEPLOYMENT_ENVIRONMENT" in
          staging)
            expected_readiness_url="https://staging.geosearch.cataqui.com/v1/health"
            ;;
          production)
            expected_readiness_url="https://geosearch.cataqui.com/v1/health"
            ;;
          *)
            echo "Geosearch Worker deployments support only staging and production." >&2
            exit 1
            ;;
        esac

        if [[ "$READINESS_URL" != "$expected_readiness_url" ]]; then
          echo "The readiness URL does not match the protected $DEPLOYMENT_ENVIRONMENT endpoint." >&2
          exit 1
        fi

    - name: Create the ephemeral Wrangler secrets file
      id: secrets-file
      shell: bash
      env:
        GOOGLE_PLACES_API_KEY: ${{ inputs.google-places-api-key }}
      run: |
        set -euo pipefail
        umask 077
        secrets_file="$RUNNER_TEMP/cataqui-geosearch-secrets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

        jq -n '{GOOGLE_PLACES_API_KEY: env.GOOGLE_PLACES_API_KEY}' > "$secrets_file"
        echo "path=$secrets_file" >> "$GITHUB_OUTPUT"

    - name: Deploy the geosearch Worker
      id: deploy
      uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        packageManager: pnpm
        workingDirectory: apps/workers/geosearch
        command: >-
          deploy --strict --config wrangler.jsonc
          --env ${{ inputs.environment }}
          --secrets-file ${{ steps.secrets-file.outputs.path }}
          --tag ${{ github.sha }}
          --message "GitHub Actions run ${{ github.run_id }}"

    - name: Remove the ephemeral Wrangler secrets file
      if: always() && steps.secrets-file.outputs.path != ''
      shell: bash
      env:
        SECRETS_FILE: ${{ steps.secrets-file.outputs.path }}
      run: rm -f -- "$SECRETS_FILE"

    - name: Verify the deployed geosearch readiness
      id: readiness
      if: steps.deploy.outcome == 'success'
      shell: bash
      env:
        READINESS_URL: ${{ inputs.readiness-url }}
      run: |
        set -euo pipefail

        for attempt in {1..30}; do
          response_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 5 --max-time 15 "$READINESS_URL" || true)"

          if [[ "$response_status" == "204" ]]; then
            exit 0
          fi

          sleep 10
        done

        echo "The geosearch Worker did not return the expected readiness response." >&2
        exit 1

    - name: Roll back an unhealthy geosearch Worker deployment
      id: rollback
      if: failure() && steps.deploy.outcome == 'success' && steps.readiness.outcome == 'failure'
      uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        packageManager: pnpm
        workingDirectory: apps/workers/geosearch
        command: >-
          rollback --config wrangler.jsonc
          --env ${{ inputs.environment }} --yes
          --message "Automatic rollback after failed readiness check in GitHub Actions run ${{ github.run_id }}"

    - name: Verify the geosearch readiness after rollback
      if: failure() && steps.rollback.outcome == 'success'
      shell: bash
      env:
        READINESS_URL: ${{ inputs.readiness-url }}
      run: |
        set -euo pipefail

        response_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
          --connect-timeout 5 --max-time 15 "$READINESS_URL" || true)"

        if [[ "$response_status" != "204" ]]; then
          echo "The geosearch Worker remained unhealthy after rollback." >&2
          exit 1
        fi
