name: Deploy Neon Terraform
description: Validate, plan, and apply the environment's Neon PostgreSQL infrastructure

inputs:
  environment:
    description: Cataquí database environment to deploy
    required: true
  terraform-api-token:
    description: HCP Terraform API token
    required: true
  neon-api-key:
    description: Neon organization API key
    required: true
  neon-organization-id:
    description: Neon organization that owns the database projects
    required: true

outputs:
  project-id:
    description: Terraform-generated Neon project identifier
    value: ${{ steps.database-configuration.outputs.project-id }}
  database-owner-direct-url:
    description: Sensitive direct PostgreSQL owner URL for Prisma migrations
    value: ${{ steps.database-configuration.outputs.database-owner-direct-url }}
  database-app-pooler-url:
    description: Sensitive pooled PostgreSQL URL for the least-privilege application role
    value: ${{ steps.database-configuration.outputs.database-app-pooler-url }}

runs:
  using: composite
  steps:
    - name: Verify protected environment credentials are available
      shell: bash
      env:
        HCP_TERRAFORM_TOKEN: ${{ inputs.terraform-api-token }}
        NEON_API_KEY: ${{ inputs.neon-api-key }}
        NEON_ORGANIZATION_ID: ${{ inputs.neon-organization-id }}
      run: |
        set -euo pipefail

        if [[ -z "$HCP_TERRAFORM_TOKEN" ]]; then
          echo "TERRAFORM_API_TOKEN must be available in the selected Infisical environment" >&2
          exit 1
        fi

        if [[ -z "$NEON_API_KEY" ]]; then
          echo "NEON_API_KEY must be available in the selected Infisical environment" >&2
          exit 1
        fi

        if [[ ! "$NEON_ORGANIZATION_ID" =~ ^org-[a-z0-9-]+$ ]]; then
          echo "NEON_ORGANIZATION_ID must be a Neon organization identifier beginning with org-" >&2
          exit 1
        fi

    - name: Read the pinned Terraform version
      id: terraform-version
      shell: bash
      run: |
        terraform_version="$(tr -d '[:space:]' < infra/neon/.terraform-version)"

        if [[ ! "$terraform_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "infra/neon/.terraform-version must contain a semantic version such as 1.15.8" >&2
          exit 1
        fi

        echo "version=$terraform_version" >> "$GITHUB_OUTPUT"

    - name: Install Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: ${{ steps.terraform-version.outputs.version }}
        terraform_wrapper: false

    - name: Install TFLint
      uses: terraform-linters/setup-tflint@c750028ac0f3831886a261f96da68ab58a92e7ec # v6
      with:
        cache: true
        tflint_config_path: infra/neon/.tflint.hcl
        tflint_version: v0.64.0

    - name: Verify the deployment target
      shell: bash
      env:
        TERRAFORM_TARGET_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if [[ "$TERRAFORM_ROOT" != "infra/neon/database" || ! -f "$TERRAFORM_ROOT/versions.tf" ]]; then
          echo "TERRAFORM_ROOT must identify the Neon database Terraform root" >&2
          exit 1
        fi

        if [[ "$TERRAFORM_TARGET_ENVIRONMENT" != "staging" && "$TERRAFORM_TARGET_ENVIRONMENT" != "production" ]]; then
          echo "environment must be staging or production" >&2
          exit 1
        fi

    - name: Verify Terraform formatting
      shell: bash
      run: terraform fmt -check -recursive infra/neon

    - name: Verify PostgreSQL privilege tooling is available
      shell: bash
      run: |
        if ! command -v psql >/dev/null 2>&1; then
          echo "psql must be installed on the runner before Neon infrastructure can be applied" >&2
          exit 1
        fi

    - name: Initialize Terraform and the HCP workspace
      shell: bash
      run: terraform init -input=false
      working-directory: ${{ env.TERRAFORM_ROOT }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.terraform-api-token }}

    - name: Validate the Terraform configuration
      shell: bash
      run: terraform validate
      working-directory: ${{ env.TERRAFORM_ROOT }}

    - name: Initialize TFLint plugins
      shell: bash
      run: tflint --chdir=infra/neon --config="$GITHUB_WORKSPACE/infra/neon/.tflint.hcl" --init
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Verify Terraform conventions
      shell: bash
      run: tflint --chdir=infra/neon --config="$GITHUB_WORKSPACE/infra/neon/.tflint.hcl" --recursive --format compact

    - name: Verify Terraform behavior
      shell: bash
      run: terraform test
      working-directory: ${{ env.TERRAFORM_ROOT }}

    - name: Create the exact Neon infrastructure plan
      shell: bash
      run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      working-directory: ${{ env.TERRAFORM_ROOT }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.terraform-api-token }}
        NEON_API_KEY: ${{ inputs.neon-api-key }}
        TF_VAR_neon_organization_id: ${{ inputs.neon-organization-id }}

    - name: Add the infrastructure plan to the workflow summary
      shell: bash
      run: terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
      working-directory: ${{ env.TERRAFORM_ROOT }}

    - name: Apply the exact Neon infrastructure plan
      shell: bash
      run: terraform apply -input=false -lock-timeout=5m tfplan
      working-directory: ${{ env.TERRAFORM_ROOT }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.terraform-api-token }}
        NEON_API_KEY: ${{ inputs.neon-api-key }}
        TF_VAR_neon_organization_id: ${{ inputs.neon-organization-id }}

    - name: Enforce least-privilege application access
      shell: bash
      working-directory: ${{ env.TERRAFORM_ROOT }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.terraform-api-token }}
      run: |
        set -euo pipefail

        database_owner_direct_url="$(terraform output -raw database_owner_direct_url)"
        app_role_name="$(terraform output -json project | jq --exit-status --raw-output '.app_role | select(type == "string" and length > 0)')"
        app_role_password="$(terraform output -raw database_app_password)"

        if [[ -z "$database_owner_direct_url" || ! "$app_role_name" =~ ^[a-z][a-z0-9_]{0,62}$ || -z "$app_role_password" ]]; then
          echo "Terraform returned an invalid database owner URL, application role name, or application role password" >&2
          exit 1
        fi

        echo "::add-mask::$database_owner_direct_url"
        echo "::add-mask::$app_role_password"
        psql "$database_owner_direct_url" \
          --set=ON_ERROR_STOP=1 \
          --set=app_role_name="$app_role_name" \
          --set=app_role_password="$app_role_password" \
          --file="$GITHUB_ACTION_PATH/enforce-app-role-privileges.sql"

    - name: Prepare generated database configuration for secure synchronization
      id: database-configuration
      shell: bash
      working-directory: ${{ env.TERRAFORM_ROOT }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.terraform-api-token }}
      run: |
        set -euo pipefail

        project_id="$(terraform output -json project | jq --exit-status --raw-output '.project_id | select(type == "string" and length > 0)')"
        database_owner_direct_url="$(terraform output -raw database_owner_direct_url)"
        database_app_pooler_url="$(terraform output -raw database_app_pooler_url)"

        if [[ -z "$database_owner_direct_url" || -z "$database_app_pooler_url" ]]; then
          echo "Terraform returned an empty Neon database connection URL" >&2
          exit 1
        fi

        echo "::add-mask::$project_id"
        echo "::add-mask::$database_owner_direct_url"
        echo "::add-mask::$database_app_pooler_url"
        echo "project-id=$project_id" >> "$GITHUB_OUTPUT"
        echo "database-owner-direct-url=$database_owner_direct_url" >> "$GITHUB_OUTPUT"
        echo "database-app-pooler-url=$database_app_pooler_url" >> "$GITHUB_OUTPUT"
