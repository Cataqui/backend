name: Deploy and verify Cloudflare API Worker
description: Deploy the API Worker and Containers, verify readiness, and roll back an unhealthy Worker and Container deployment

inputs:
  environment:
    description: Protected Cloudflare deployment environment
    required: true
  health-url:
    description: Public versioned API readiness endpoint
    required: true
  cloudflare-api-token:
    description: Cloudflare deployment API token
    required: true
  database-app-pooler-url:
    description: Application-role Neon pooler URL
    required: true
  ai-gateway-api-token:
    description: Cloudflare AI Gateway token used by the API container
    required: true
  auth-refresh-token-hmac-key-v1-base64url:
    description: Environment-specific base64url-encoded V1 refresh-token HMAC key
    required: true
  microservices-auth-jwt-private-key-v1-pkcs8-base64:
    description: Environment-specific base64-encoded V1 ES256 private key in PKCS8 format
    required: true
  upstash-redis-rest-url:
    description: Upstash Redis REST endpoint used by the API container
    required: true
  upstash-redis-rest-token:
    description: Upstash Redis REST token used by the API container
    required: true

runs:
  using: composite
  steps:
    - name: Verify the application deployment target
      shell: bash
      env:
        DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        HEALTH_URL: ${{ inputs.health-url }}
      run: |
        case "$DEPLOYMENT_ENVIRONMENT" in
          staging)
            expected_health_url="https://staging.api.cataqui.com/v1/health"
            ;;
          production)
            expected_health_url="https://api.cataqui.com/v1/health"
            ;;
          *)
            echo "Cloudflare application deployments support only staging and production." >&2
            exit 1
            ;;
        esac

        if [[ "$HEALTH_URL" != "$expected_health_url" ]]; then
          echo "The health URL does not match the protected $DEPLOYMENT_ENVIRONMENT endpoint." >&2
          exit 1
        fi

    - name: Create the ephemeral Wrangler secrets file
      id: secrets-file
      shell: bash
      env:
        DATABASE_APP_POOLER_URL: ${{ inputs.database-app-pooler-url }}
        AI_GATEWAY_API_TOKEN: ${{ inputs.ai-gateway-api-token }}
        AUTH_REFRESH_TOKEN_HMAC_KEY_V1_BASE64URL: ${{ inputs.auth-refresh-token-hmac-key-v1-base64url }}
        MICROSERVICES_AUTH_JWT_PRIVATE_KEY_V1_PKCS8_BASE64: ${{ inputs.microservices-auth-jwt-private-key-v1-pkcs8-base64 }}
        UPSTASH_REDIS_REST_URL: ${{ inputs.upstash-redis-rest-url }}
        UPSTASH_REDIS_REST_TOKEN: ${{ inputs.upstash-redis-rest-token }}
      run: |
        umask 077
        secrets_file="$RUNNER_TEMP/cataqui-cloudflare-secrets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

        jq -n '{
          DATABASE_APP_POOLER_URL: env.DATABASE_APP_POOLER_URL,
          AI_GATEWAY_API_TOKEN: env.AI_GATEWAY_API_TOKEN,
          AUTH_REFRESH_TOKEN_HMAC_KEY_V1_BASE64URL: env.AUTH_REFRESH_TOKEN_HMAC_KEY_V1_BASE64URL,
          MICROSERVICES_AUTH_JWT_PRIVATE_KEY_V1_PKCS8_BASE64: env.MICROSERVICES_AUTH_JWT_PRIVATE_KEY_V1_PKCS8_BASE64,
          UPSTASH_REDIS_REST_URL: env.UPSTASH_REDIS_REST_URL,
          UPSTASH_REDIS_REST_TOKEN: env.UPSTASH_REDIS_REST_TOKEN
        }' > "$secrets_file"

        echo "path=$secrets_file" >> "$GITHUB_OUTPUT"

    - name: Deploy the Worker and immediately replace its pre-launch Containers
      id: deploy
      uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        packageManager: pnpm
        command: >-
          deploy --strict --cwd apps/api
          --config wrangler.jsonc --containers-rollout immediate
          --env ${{ inputs.environment }}
          --secrets-file ${{ steps.secrets-file.outputs.path }}
          --tag ${{ github.sha }}
          --message "GitHub Actions run ${{ github.run_id }}"

    - name: Remove the ephemeral Wrangler secrets file
      if: always() && steps.secrets-file.outputs.path != ''
      shell: bash
      env:
        SECRETS_FILE: ${{ steps.secrets-file.outputs.path }}
      run: rm -f -- "$SECRETS_FILE"

    - name: Verify the deployed API readiness
      id: readiness
      if: steps.deploy.outcome == 'success'
      shell: bash
      env:
        HEALTH_URL: ${{ inputs.health-url }}
      run: >-
        curl --fail --silent --show-error --output /dev/null
        --connect-timeout 5 --max-time 15
        --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300
        "$HEALTH_URL"

    - name: Roll back an unhealthy API deployment
      id: rollback
      if: failure() && steps.deploy.outcome == 'success' && steps.readiness.outcome == 'failure'
      uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        packageManager: pnpm
        command: >-
          rollback --cwd apps/api --config wrangler.jsonc
          --env ${{ inputs.environment }} --yes
          --message "Automatic rollback after failed readiness check in GitHub Actions run ${{ github.run_id }}"

    - name: Verify the API readiness after rollback
      if: failure() && steps.rollback.outcome == 'success'
      shell: bash
      env:
        HEALTH_URL: ${{ inputs.health-url }}
      run: |
        if curl --fail --silent --show-error --output /dev/null \
          --connect-timeout 5 --max-time 15 \
          --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 \
          "$HEALTH_URL"; then
          exit 0
        fi

        echo "The API remained unhealthy after rollback." >&2
        exit 1
