name: Neon database access OpenTofu
description: Plan or apply the neon-database-access OpenTofu root.
inputs:
  environment:
    description: OpenTofu environment; must be staging or production.
    required: true
  operation:
    description: OpenTofu operation; must be plan or apply.
    required: true
outputs:
  has-changes:
    description: Whether the saved plan contains changes.
    value: ${{ steps.root.outputs.has-changes }}
runs:
  using: composite
  steps:
    - id: root
      uses: ./.github/actions/opentofu-root
      env:
        # PostgreSQL grants the creator SET/INHERIT on newly created Auth roles.
        PGOPTIONS: '-c createrole_self_grant=set,inherit'
      with:
        root: neon-database-access
        environment: ${{ inputs.environment }}
        operation: ${{ inputs.operation }}
