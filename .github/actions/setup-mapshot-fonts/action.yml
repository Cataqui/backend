name: Set up Mapshot font tooling
description: Install the qualified FontTools dependency for native font contract tests.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: apps/mapshot/build/fonts/requirements.txt
    - shell: bash
      run: python3 -m pip install --require-hashes -r apps/mapshot/build/fonts/requirements.txt
