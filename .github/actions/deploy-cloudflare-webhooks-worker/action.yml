name: Deploy Cloudflare Webhooks Worker safely
description: Deploy the provider webhook ingress, verify its readiness route, and roll back an unhealthy Worker deployment

inputs:
  environment:
    description: Protected Cloudflare deployment environment
    required: true
  readiness-url:
    description: Public provider route used to verify the deployed Webhooks Worker
    required: true
  cloudflare-api-token:
    description: Cloudflare deployment API token
    required: true
  meta-app-secret:
    description: Meta application secret used to authenticate WhatsApp webhook payloads
    required: true
  whatsapp-auth-webhook-verify-token:
    description: Shared token used for Meta WhatsApp webhook registration
    required: true
runs:
  using: composite
  steps:
    - name: Verify the Webhooks Worker deployment target
      shell: bash
      env:
        DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        READINESS_URL: ${{ inputs.readiness-url }}
      run: |
        set -euo pipefail

        case "$DEPLOYMENT_ENVIRONMENT" in
          staging)
            expected_readiness_url="https://staging.webhooks.cataqui.com/whatsapp"
            ;;
          production)
            expected_readiness_url="https://webhooks.cataqui.com/whatsapp"
            ;;
          *)
            echo "Webhooks Worker deployments support only staging and production." >&2
            exit 1
            ;;
        esac

        if [[ "$READINESS_URL" != "$expected_readiness_url" ]]; then
          echo "The readiness URL does not match the protected $DEPLOYMENT_ENVIRONMENT endpoint." >&2
          exit 1
        fi

    - name: Create the ephemeral Wrangler secrets file
      id: secrets-file
      shell: bash
      env:
        META_APP_SECRET: ${{ inputs.meta-app-secret }}
        WHATSAPP_AUTH_WEBHOOK_VERIFY_TOKEN: ${{ inputs.whatsapp-auth-webhook-verify-token }}
      run: |
        set -euo pipefail
        umask 077
        secrets_file="$RUNNER_TEMP/cataqui-webhooks-secrets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

        jq -n '{
          META_APP_SECRET: env.META_APP_SECRET,
          WHATSAPP_AUTH_WEBHOOK_VERIFY_TOKEN: env.WHATSAPP_AUTH_WEBHOOK_VERIFY_TOKEN
        }' > "$secrets_file"

        echo "path=$secrets_file" >> "$GITHUB_OUTPUT"

    - name: Deploy the webhooks Worker
      id: deploy
      uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        packageManager: pnpm
        workingDirectory: apps/workers/webhooks
        command: >-
          deploy --strict --config wrangler.jsonc
          --env ${{ inputs.environment }}
          --secrets-file ${{ steps.secrets-file.outputs.path }}
          --tag ${{ github.sha }}
          --message "GitHub Actions run ${{ github.run_id }}"

    - name: Remove the ephemeral Wrangler secrets file
      if: always() && steps.secrets-file.outputs.path != ''
      shell: bash
      env:
        SECRETS_FILE: ${{ steps.secrets-file.outputs.path }}
      run: rm -f -- "$SECRETS_FILE"

    - name: Verify the deployed Webhooks Worker route
      id: readiness
      if: steps.deploy.outcome == 'success'
      shell: bash
      env:
        READINESS_URL: ${{ inputs.readiness-url }}
      run: |
        set -euo pipefail

        for attempt in {1..30}; do
          response_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 5 --max-time 15 \
            --get \
            --data-urlencode 'hub.mode=subscribe' \
            --data-urlencode 'hub.verify_token=cataqui-readiness-invalid-token' \
            --data-urlencode 'hub.challenge=readiness' \
            "$READINESS_URL" || true)"

          if [[ "$response_status" == "403" ]]; then
            exit 0
          fi

          sleep 10
        done

        echo "The webhooks Worker did not return the expected readiness response." >&2
        exit 1

    - name: Roll back an unhealthy Webhooks Worker deployment
      id: rollback
      if: failure() && steps.deploy.outcome == 'success' && steps.readiness.outcome == 'failure'
      uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        packageManager: pnpm
        workingDirectory: apps/workers/webhooks
        command: >-
          rollback --config wrangler.jsonc
          --env ${{ inputs.environment }} --yes
          --message "Automatic rollback after failed readiness check in GitHub Actions run ${{ github.run_id }}"

    - name: Verify the Webhooks Worker route after rollback
      if: failure() && steps.rollback.outcome == 'success'
      shell: bash
      env:
        READINESS_URL: ${{ inputs.readiness-url }}
      run: |
        set -euo pipefail

        response_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
          --connect-timeout 5 --max-time 15 \
          --get \
          --data-urlencode 'hub.mode=subscribe' \
          --data-urlencode 'hub.verify_token=cataqui-readiness-invalid-token' \
          --data-urlencode 'hub.challenge=readiness' \
          "$READINESS_URL" || true)"

        if [[ "$response_status" != "403" ]]; then
          echo "The webhook route remained unhealthy after rollback." >&2
          exit 1
        fi
