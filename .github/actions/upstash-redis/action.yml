name: Upstash Redis OpenTofu
description: Plan or apply the upstash-redis OpenTofu root.
inputs:
  environment:
    description: OpenTofu environment; must be staging or production.
    required: true
  operation:
    description: OpenTofu operation; must be plan or apply.
    required: true
outputs:
  has-changes:
    description: Whether the saved plan contains changes.
    value: ${{ steps.root.outputs.has-changes }}
runs:
  using: composite
  steps:
    - id: root
      uses: ./.github/actions/opentofu-root
      with:
        root: upstash-redis
        environment: ${{ inputs.environment }}
        operation: ${{ inputs.operation }}
