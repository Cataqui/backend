name: Cloudflare zone DNS OpenTofu
description: Plan or apply the production cloudflare-zone-dns OpenTofu root.
inputs:
  operation:
    description: OpenTofu operation; must be plan or apply.
    required: true
outputs:
  has-changes:
    description: Whether the saved plan contains changes.
    value: ${{ steps.root.outputs.has-changes }}
runs:
  using: composite
  steps:
    - id: root
      uses: ./.github/actions/opentofu-root
      with:
        root: cloudflare-zone-dns
        environment: production
        operation: ${{ inputs.operation }}
