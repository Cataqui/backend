name: Load Infisical secrets
description: Authenticate with Infisical and load an approved secret profile into the current job environment.

inputs:
  environment:
    description: Infisical environment; must be staging or production.
    required: true
  profile:
    description: Approved profile declared in profiles.json.
    required: true
  infisical-identity-id:
    description: Infisical machine identity ID configured for GitHub OIDC.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve approved profile
      id: profile
      shell: ruby {0}
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INFISICAL_IDENTITY_ID: ${{ inputs.infisical-identity-id }}
        PROFILE_MANIFEST: ${{ github.action_path }}/profiles.json
      run: load File.join(ENV.fetch("GITHUB_ACTION_PATH"), "get-secret-profile.rb")

    - name: Fetch approved Infisical profile
      uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
      with:
        method: oidc
        identity-id: ${{ inputs.infisical-identity-id }}
        oidc-audience: https://github.com/Cataqui
        project-slug: ${{ steps.profile.outputs.project-slug }}
        env-slug: ${{ inputs.environment }}
        secret-path: ${{ steps.profile.outputs.secret-path }}
        recursive: false
        include-imports: false
        export-type: env

    - name: Validate and map profile credentials
      shell: ruby {0}
      env:
        INPUT_PROFILE: ${{ inputs.profile }}
        PROFILE_MANIFEST: ${{ github.action_path }}/profiles.json
      run: load File.join(ENV.fetch("GITHUB_ACTION_PATH"), "validate-and-export-profile-secrets.rb")

    # GitHub's supported OIDC token SDK is JavaScript; keep only the provider call here.
    - name: Get GitHub OIDC token
      id: oidc
      if: steps.profile.outputs.authenticate-infisical-provider == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        result-encoding: string
        script: |
          const token = await core.getIDToken("https://github.com/Cataqui");
          core.setSecret(token);
          return token;

    - name: Authenticate the Infisical OpenTofu provider
      if: steps.profile.outputs.authenticate-infisical-provider == 'true'
      shell: ruby {0}
      env:
        INFISICAL_IDENTITY_ID: ${{ inputs.infisical-identity-id }}
        INFISICAL_OIDC_TOKEN: ${{ steps.oidc.outputs.result }}
      run: |
        token = ENV.fetch("INFISICAL_OIDC_TOKEN")
        abort "GitHub returned an invalid OIDC token." if token.empty? || token.include?("\n") || token.include?("\r")
        File.open(ENV.fetch("GITHUB_ENV"), "a") do |output|
          output.puts "INFISICAL_AUTH_METHOD=oidc"
          output.puts "INFISICAL_MACHINE_IDENTITY_ID=#{ENV.fetch("INFISICAL_IDENTITY_ID")}"
          output.puts "INFISICAL_AUTH_JWT=#{token}"
        end
