name: Cloudflare zone configuration OpenTofu
description: Plan or apply the production cloudflare-zone-configuration OpenTofu root.

inputs:
  operation:
    description: OpenTofu operation; must be plan or apply.
    required: true

outputs:
  has-changes:
    description: Whether the saved plan contains changes.
    value: ${{ steps.plan.outputs.has-changes }}

runs:
  using: composite
  steps:
    - name: Validate invocation
      shell: bash
      env:
        INPUT_OPERATION: ${{ inputs.operation }}
      run: |
        set -euo pipefail
        case "$INPUT_OPERATION" in
          plan | apply) ;;
          *) echo "operation must be plan or apply." >&2; exit 1 ;;
        esac

    - name: Set up OpenTofu
      uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        tofu_version: 1.12.6
        tofu_wrapper: false

    - name: Initialize backend
      shell: bash
      working-directory: ${{ github.workspace }}/infrastructure/opentofu/roots/cloudflare-zone-configuration
      run: |
        set -euo pipefail
        tofu init -reconfigure -input=false \
          -backend-config="../../backends/r2.s3.tfbackend" \
          -backend-config="../../environments/production/cloudflare-zone-configuration.s3.tfbackend"

    - name: Create saved plan
      id: plan
      shell: bash
      working-directory: ${{ github.workspace }}/infrastructure/opentofu/roots/cloudflare-zone-configuration
      run: |
        set +e
        umask 077
        tofu plan -input=false -detailed-exitcode -lock-timeout=5m \
          -out="$RUNNER_TEMP/cloudflare-zone-configuration.tfplan" \
          > "$RUNNER_TEMP/cloudflare-zone-configuration-plan.log" 2>&1
        status=$?
        set -e
        case "$status" in
          0) echo "has-changes=false" >> "$GITHUB_OUTPUT" ;;
          2) echo "has-changes=true" >> "$GITHUB_OUTPUT" ;;
          *)
            node "$GITHUB_ACTION_PATH/../summarize-opentofu-failure.mjs" "$RUNNER_TEMP/$(basename "$GITHUB_ACTION_PATH")-plan.log" plan
            exit "$status"
            ;;
        esac

    - name: Apply exact saved plan
      if: inputs.operation == 'apply'
      shell: bash
      working-directory: ${{ github.workspace }}/infrastructure/opentofu/roots/cloudflare-zone-configuration
      run: |
        set -euo pipefail
        set +e
        tofu apply -input=false -auto-approve -lock-timeout=5m \
          "$RUNNER_TEMP/cloudflare-zone-configuration.tfplan" \
          > "$RUNNER_TEMP/cloudflare-zone-configuration-apply.log" 2>&1
        apply_status=$?
        set -e
        if [[ "$apply_status" -ne 0 ]]; then
          node "$GITHUB_ACTION_PATH/../summarize-opentofu-failure.mjs" "$RUNNER_TEMP/$(basename "$GITHUB_ACTION_PATH")-apply.log" apply
        fi

        set +e
        tofu plan -input=false -detailed-exitcode -lock-timeout=5m \
          > "$RUNNER_TEMP/cloudflare-zone-configuration-verify.log" 2>&1
        verify_status=$?
        set -e
        case "$verify_status" in
          0)
            if [[ "$apply_status" -ne 0 ]]; then
              echo "Cloudflare reported a post-apply provider error, but a fresh plan verified exact convergence."
            fi
            ;;
          2)
            echo "Cloudflare zone configuration still has changes after apply." >&2
            exit 1
            ;;
          *)
            node "$GITHUB_ACTION_PATH/../summarize-opentofu-failure.mjs" "$RUNNER_TEMP/$(basename "$GITHUB_ACTION_PATH")-verify.log" plan
            exit "$verify_status"
            ;;
        esac

    - name: Remove temporary plan files
      if: always()
      shell: bash
      run: |
        rm -f -- \
          "$RUNNER_TEMP/cloudflare-zone-configuration.tfplan" \
          "$RUNNER_TEMP/cloudflare-zone-configuration-plan.log" \
          "$RUNNER_TEMP/cloudflare-zone-configuration-apply.log" \
          "$RUNNER_TEMP/cloudflare-zone-configuration-verify.log"
