name: Deploy Upstash Terraform
description: Validate, plan, and apply the environment's Upstash Redis infrastructure

inputs:
  environment:
    description: Persistent environment to deploy
    required: true
  terraform-api-token:
    description: HCP Terraform API token
    required: true
  upstash-email:
    description: Email for the environment-scoped Upstash account
    required: true
  upstash-api-key:
    description: Developer API key for the environment-scoped Upstash account
    required: true

outputs:
  redis-rest-token:
    description: Sensitive Upstash Redis REST token generated by Terraform
    value: ${{ steps.runtime-credentials.outputs.redis-rest-token }}
  redis-rest-url:
    description: Upstash Redis REST URL generated by Terraform
    value: ${{ steps.runtime-credentials.outputs.redis-rest-url }}

runs:
  using: composite
  steps:
    - name: Verify protected environment credentials are available
      shell: bash
      env:
        HCP_TERRAFORM_TOKEN: ${{ inputs.terraform-api-token }}
        UPSTASH_TERRAFORM_EMAIL: ${{ inputs.upstash-email }}
        UPSTASH_TERRAFORM_API_KEY: ${{ inputs.upstash-api-key }}
      run: |
        if [[ -z "$HCP_TERRAFORM_TOKEN" ]]; then
          echo "TERRAFORM_API_TOKEN must be available in the selected Infisical environment" >&2
          exit 1
        fi

        if [[ -z "$UPSTASH_TERRAFORM_EMAIL" ]]; then
          echo "UPSTASH_TERRAFORM_EMAIL must be available in the selected Infisical environment" >&2
          exit 1
        fi

        if [[ -z "$UPSTASH_TERRAFORM_API_KEY" ]]; then
          echo "UPSTASH_TERRAFORM_API_KEY must be available in the selected Infisical environment" >&2
          exit 1
        fi

    - name: Read the pinned Terraform version
      id: terraform-version
      shell: bash
      run: |
        terraform_version="$(tr -d '[:space:]' < infrastructure/upstash/.terraform-version)"

        if [[ ! "$terraform_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "infrastructure/upstash/.terraform-version must contain a semantic version such as 1.15.8" >&2
          exit 1
        fi

        echo "version=$terraform_version" >> "$GITHUB_OUTPUT"

    - name: Install Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: ${{ steps.terraform-version.outputs.version }}
        terraform_wrapper: false

    - name: Install TFLint
      uses: terraform-linters/setup-tflint@c750028ac0f3831886a261f96da68ab58a92e7ec # v6
      with:
        cache: true
        tflint_config_path: infrastructure/upstash/.tflint.hcl
        tflint_version: v0.64.0

    - name: Verify the deployment target
      shell: bash
      env:
        TERRAFORM_TARGET_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if [[ "$TERRAFORM_ROOT" != "infrastructure/upstash/redis" || ! -f "$TERRAFORM_ROOT/versions.tf" ]]; then
          echo "TERRAFORM_ROOT must identify the Upstash Redis Terraform root" >&2
          exit 1
        fi

        if [[ "$TERRAFORM_TARGET_ENVIRONMENT" != "staging" && "$TERRAFORM_TARGET_ENVIRONMENT" != "production" ]]; then
          echo "environment must be staging or production" >&2
          exit 1
        fi

    - name: Verify Terraform formatting
      shell: bash
      run: terraform fmt -check -recursive infrastructure/upstash

    - name: Initialize Terraform and the HCP workspace
      shell: bash
      run: terraform init -input=false
      working-directory: ${{ env.TERRAFORM_ROOT }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.terraform-api-token }}

    - name: Validate the Terraform configuration
      shell: bash
      run: terraform validate
      working-directory: ${{ env.TERRAFORM_ROOT }}

    - name: Initialize TFLint plugins
      shell: bash
      run: tflint --chdir=infrastructure/upstash --config="$GITHUB_WORKSPACE/infrastructure/upstash/.tflint.hcl" --init
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Verify Terraform conventions
      shell: bash
      run: tflint --chdir=infrastructure/upstash --config="$GITHUB_WORKSPACE/infrastructure/upstash/.tflint.hcl" --recursive --format compact

    - name: Verify Terraform behavior
      shell: bash
      run: terraform test
      working-directory: ${{ env.TERRAFORM_ROOT }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.terraform-api-token }}

    - name: Create the exact Upstash infrastructure plan
      shell: bash
      run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      working-directory: ${{ env.TERRAFORM_ROOT }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.terraform-api-token }}
        UPSTASH_EMAIL: ${{ inputs.upstash-email }}
        UPSTASH_API_KEY: ${{ inputs.upstash-api-key }}

    - name: Add the infrastructure plan to the workflow summary
      shell: bash
      run: terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
      working-directory: ${{ env.TERRAFORM_ROOT }}

    - name: Apply the exact Upstash infrastructure plan
      shell: bash
      run: terraform apply -input=false -lock-timeout=5m tfplan
      working-directory: ${{ env.TERRAFORM_ROOT }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.terraform-api-token }}
        UPSTASH_EMAIL: ${{ inputs.upstash-email }}
        UPSTASH_API_KEY: ${{ inputs.upstash-api-key }}

    - name: Prepare generated Redis credentials for secure synchronization
      id: runtime-credentials
      shell: bash
      working-directory: ${{ env.TERRAFORM_ROOT }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.terraform-api-token }}
      run: |
        set -euo pipefail

        redis_rest_url="$(terraform output -json database | jq --exit-status --raw-output '.rest_url | select(type == "string" and length > 0)')"
        redis_rest_token="$(terraform output -raw redis_rest_token)"

        if [[ -z "$redis_rest_token" ]]; then
          echo "Terraform returned an empty Upstash Redis REST token" >&2
          exit 1
        fi

        echo "::add-mask::$redis_rest_url"
        echo "::add-mask::$redis_rest_token"
        echo "redis-rest-url=$redis_rest_url" >> "$GITHUB_OUTPUT"
        echo "redis-rest-token=$redis_rest_token" >> "$GITHUB_OUTPUT"
