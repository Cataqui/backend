name: Synchronize Neon database configuration to Infisical
description: Write Terraform-generated Neon runtime and migration configuration to isolated Infisical folders

inputs:
  environment:
    description: Infisical environment receiving the generated database configuration
    required: true
  identity-id:
    description: Infisical machine identity authenticated through GitHub OIDC
    required: true
  infisical-api-url:
    description: Infisical API origin
    required: false
    default: https://us.infisical.com
  project-id:
    description: Terraform-generated Neon project identifier
    required: true
  infisical-project-id:
    description: Infisical project identifier used by the secret-management CLI
    required: true
  neon-api-key:
    description: Neon API key required by migration branch automation
    required: true
  database-owner-direct-url:
    description: Terraform-generated PostgreSQL owner URL for migrations only
    required: true
  database-app-pooler-url:
    description: Terraform-generated pooled PostgreSQL URL for the least-privilege application role
    required: true

runs:
  using: composite
  steps:
    - name: Set up the official Infisical CLI
      uses: ./.github/actions/setup-infisical-cli

    - name: Request a GitHub OIDC token for Infisical
      id: github-oidc
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      with:
        result-encoding: string
        script: |
          const oidcToken = await core.getIDToken("https://github.com/Cataqui");
          core.setSecret(oidcToken);
          return oidcToken;

    - name: Authenticate and synchronize generated database configuration
      shell: bash
      env:
        DATABASE_OWNER_DIRECT_URL: ${{ inputs.database-owner-direct-url }}
        DATABASE_APP_POOLER_URL: ${{ inputs.database-app-pooler-url }}
        GITHUB_OIDC_TOKEN: ${{ steps.github-oidc.outputs.result }}
        INFISICAL_API_URL: ${{ inputs.infisical-api-url }}
        INFISICAL_ENVIRONMENT: ${{ inputs.environment }}
        INFISICAL_IDENTITY_ID: ${{ inputs.identity-id }}
        INFISICAL_PROJECT_ID: ${{ inputs.infisical-project-id }}
        NEON_API_KEY: ${{ inputs.neon-api-key }}
        NEON_PROJECT_ID: ${{ inputs.project-id }}
      run: |
        set -euo pipefail

        if [[ "$INFISICAL_ENVIRONMENT" != "staging" && "$INFISICAL_ENVIRONMENT" != "production" ]]; then
          echo "environment must be staging or production" >&2
          exit 1
        fi

        if [[ -z "$INFISICAL_IDENTITY_ID" || -z "$INFISICAL_PROJECT_ID" ]]; then
          echo "INFISICAL_IDENTITY_ID and INFISICAL_PROJECT_ID must be configured as GitHub repository variables" >&2
          exit 1
        fi

        if [[ -z "$DATABASE_OWNER_DIRECT_URL" || -z "$DATABASE_APP_POOLER_URL" || -z "$NEON_API_KEY" || -z "$NEON_PROJECT_ID" ]]; then
          echo "Terraform and the Neon profile must return complete database configuration" >&2
          exit 1
        fi

        echo "::add-mask::$DATABASE_OWNER_DIRECT_URL"
        echo "::add-mask::$DATABASE_APP_POOLER_URL"
        echo "::add-mask::$NEON_API_KEY"
        echo "::add-mask::$NEON_PROJECT_ID"

        infisical_access_token="$(
          INFISICAL_JWT="$GITHUB_OIDC_TOKEN" infisical login \
            --domain="$INFISICAL_API_URL" \
            --method=oidc-auth \
            --machine-identity-id="$INFISICAL_IDENTITY_ID" \
            --plain \
            --silent \
            --telemetry=false
        )"

        if [[ -z "$infisical_access_token" ]]; then
          echo "Infisical OIDC authentication returned an empty access token" >&2
          exit 1
        fi

        echo "::add-mask::$infisical_access_token"

        INFISICAL_TOKEN="$infisical_access_token" infisical secrets set \
          "DATABASE_APP_POOLER_URL=$DATABASE_APP_POOLER_URL" \
          --domain="$INFISICAL_API_URL" \
          --env="$INFISICAL_ENVIRONMENT" \
          --path="/application/deploy" \
          --projectId="$INFISICAL_PROJECT_ID" \
          --silent \
          --telemetry=false

        INFISICAL_TOKEN="$infisical_access_token" infisical secrets set \
          "DATABASE_OWNER_DIRECT_URL=$DATABASE_OWNER_DIRECT_URL" \
          "NEON_API_KEY=$NEON_API_KEY" \
          "NEON_PROJECT_ID=$NEON_PROJECT_ID" \
          --domain="$INFISICAL_API_URL" \
          --env="$INFISICAL_ENVIRONMENT" \
          --path="/database/migration" \
          --projectId="$INFISICAL_PROJECT_ID" \
          --silent \
          --telemetry=false
