version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: terraform
    directories:
      - /infra/cloudflare/ai-gateway
      - /infra/cloudflare/queues
      - /infra/neon/database
      - /infra/upstash/redis
    schedule:
      interval: weekly
      day: monday
      time: '09:15'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      terraform-providers:
        patterns:
          - '*'
