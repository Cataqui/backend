name: Cloudflare Terraform Components Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  discover-cloudflare:
    name: Discover registered Cloudflare Terraform components
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      components: ${{ steps.registry.outputs.components }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Discover registered Cloudflare Terraform components
        id: registry
        uses: ./.github/actions/discover-cloudflare-terraform-components

  validate-modules-cloudflare:
    name: Validate reusable Cloudflare Terraform modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Terraform version
        id: terraform-version
        run: |
          terraform_version="$(tr -d '[:space:]' < infra/cloudflare/.terraform-version)"

          if [[ ! "$terraform_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "infra/cloudflare/.terraform-version must contain a semantic version such as 1.15.8" >&2
            exit 1
          fi

          echo "version=$terraform_version" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Verify every reusable module with tests
        run: |
          for module_directory in infra/cloudflare/modules/*; do
            if [[ ! -d "$module_directory/tests" ]]; then
              continue
            fi

            terraform -chdir="$module_directory" init -backend=false -input=false
            terraform -chdir="$module_directory" validate
            terraform -chdir="$module_directory" test
          done

  validate-cloudflare:
    name: Validate registered Cloudflare components
    needs: discover-cloudflare
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.discover-cloudflare.outputs.components) }}
    uses: ./.github/workflows/cloudflare-terraform-validate.yml
    with:
      component: ${{ matrix.component }}
