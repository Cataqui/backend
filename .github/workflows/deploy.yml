name: Deploy

on:
  workflow_call:
    inputs:
      scope: { type: string, required: false, default: automatic }
  workflow_dispatch:
    inputs:
      scope:
        description: Applications to deploy after infrastructure reconciliation.
        type: choice
        required: true
        default: all
        options: [all, infrastructure, ai, api, maps, mapshot, auth]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      environment: ${{ steps.scope.outputs.environment }}
      deploy-infrastructure: ${{ steps.scope.outputs.deploy-infrastructure }}
      deploy-ai: ${{ steps.scope.outputs.deploy-ai }}
      deploy-api: ${{ steps.scope.outputs.deploy-api }}
      deploy-maps: ${{ steps.scope.outputs.deploy-maps }}
      deploy-mapshot: ${{ steps.scope.outputs.deploy-mapshot }}
      promote-mapshot: ${{ steps.scope.outputs.promote-mapshot }}
      deploy-auth: ${{ steps.scope.outputs.deploy-auth }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - name: Enable pnpm for workspace dependency selection
        run: corepack enable
      - id: scope
        uses: ./.github/actions/resolve-deployment
        with: { scope: "${{ inputs.scope }}" }

  validate:
    needs: prepare
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - uses: ./.github/actions/setup-node-workspace
      - uses: ./.github/actions/setup-opentofu
      - uses: ./.github/actions/setup-mapshot-fonts
      - name: Check renderer dependency advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          manifest-path: apps/mapshot/renderer/Cargo.toml
          arguments: --locked
      - name: Run manual repository gate
        run: pnpm check

  infrastructure:
    needs: [prepare, validate]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.deploy-infrastructure == 'true' && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - uses: ./.github/actions/setup-node-workspace
        with: { generate-clients: 'false' }
      - uses: ./.github/actions/reconcile-infrastructure
        with: { environment: "${{ needs.prepare.outputs.environment }}", infisical-identity-id: "${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}", google-workload-identity-provider: "${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}" }
      - name: Validate Maps runtime secret before application deployment
        if: needs.prepare.outputs.deploy-maps == 'true'
        uses: ./.github/actions/load-infisical-secrets
        with: { environment: "${{ needs.prepare.outputs.environment }}", profile: maps-runtime, infisical-identity-id: "${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}" }
      - name: Clear preflight Maps runtime secret
        if: always() && needs.prepare.outputs.deploy-maps == 'true'
        shell: ruby {0}
        run: |
          File.open(ENV.fetch("GITHUB_ENV"), "a") do |file|
            %w[GOOGLE_PLACES_API_KEY STATIC_MAP_LOCATION_SIGNING_KEY_BASE64URL].each { |name| file.puts "#{name}=" }
          end

  auth:
    needs: [prepare, validate, infrastructure]
    if: always() && !cancelled() && needs.prepare.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped') && needs.prepare.outputs.deploy-auth == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - uses: ./.github/actions/setup-node-workspace
      - name: Build shared application packages
        run: pnpm --filter "@cataqui/auth-worker^..." build
      - name: Validate and apply Auth migrations
        uses: ./.github/actions/neon-migrations
        with: { environment: "${{ needs.prepare.outputs.environment }}", application: auth, infisical-identity-id: "${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}" }
      - name: Deploy Auth
        uses: ./.github/actions/deploy-auth
        with: { environment: "${{ needs.prepare.outputs.environment }}", infisical-identity-id: "${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}" }

  ai:
    needs: [prepare, validate, infrastructure, auth]
    if: always() && !cancelled() && needs.prepare.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped') && (needs.auth.result == 'success' || needs.auth.result == 'skipped') && needs.prepare.outputs.deploy-ai == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - uses: ./.github/actions/setup-node-workspace
      - name: Build shared application packages
        run: pnpm --filter "@cataqui/ai-worker^..." build
      - name: Deploy AI
        uses: ./.github/actions/deploy-ai
        with: { environment: "${{ needs.prepare.outputs.environment }}", infisical-identity-id: "${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}" }

  mapshot:
    needs: [prepare, validate, infrastructure]
    if: always() && !cancelled() && needs.prepare.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped') && needs.prepare.outputs.deploy-mapshot == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mapshot-release.yml
    with:
      environment: ${{ needs.prepare.outputs.environment }}
      revision: ${{ github.sha }}
      promote: ${{ needs.prepare.outputs.promote-mapshot == 'true' }}

  deploy:
    needs: [prepare, validate, infrastructure, mapshot, auth]
    if: always() && !cancelled() && needs.prepare.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && (needs.prepare.outputs.deploy-api == 'true' || needs.prepare.outputs.deploy-maps == 'true') && (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped') && (needs.mapshot.result == 'success' || needs.mapshot.result == 'skipped') && (needs.auth.result == 'success' || needs.auth.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - uses: ./.github/actions/setup-node-workspace
      - name: Build shared application packages
        if: needs.prepare.outputs.deploy-api == 'true' || needs.prepare.outputs.deploy-maps == 'true'
        shell: ruby {0}
        env:
          DEPLOY_API: ${{ needs.prepare.outputs.deploy-api }}
          DEPLOY_MAPS: ${{ needs.prepare.outputs.deploy-maps }}
        run: |
          filters = []
          filters.concat(["--filter", "@cataqui/api-worker^..."]) if ENV.fetch("DEPLOY_API") == "true"
          filters.concat(["--filter", "@cataqui/maps-worker^..."]) if ENV.fetch("DEPLOY_MAPS") == "true"
          exec "pnpm", *filters, "build"
      - name: Validate and apply migrations
        if: needs.prepare.outputs.deploy-api == 'true'
        uses: ./.github/actions/neon-migrations
        with: { environment: "${{ needs.prepare.outputs.environment }}", infisical-identity-id: "${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}" }
      - name: Deploy Maps
        if: needs.prepare.outputs.deploy-maps == 'true'
        uses: ./.github/actions/deploy-maps
        with: { environment: "${{ needs.prepare.outputs.environment }}", infisical-identity-id: "${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}" }
      - name: Deploy API
        if: needs.prepare.outputs.deploy-api == 'true'
        uses: ./.github/actions/deploy-api
        with: { environment: "${{ needs.prepare.outputs.environment }}", infisical-identity-id: "${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}" }

  release-complete:
    name: Verify complete release
    needs: [prepare, validate, infrastructure, auth, ai, mapshot, deploy]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - name: Require every selected release job to succeed
        shell: ruby {0}
        env:
          RELEASE_JOBS: ${{ toJSON(needs) }}
        run: |
          require "json"
          failed = JSON.parse(ENV.fetch("RELEASE_JOBS")).reject do |_name, job|
            %w[success skipped].include?(job.fetch("result"))
          end
          abort "Release did not complete: #{failed.keys.join(', ')}." unless failed.empty?
          File.open(ENV.fetch("GITHUB_STEP_SUMMARY"), "a") do |summary|
            summary.puts "Every selected application and infrastructure job completed successfully."
          end
