name: Deploy

on:
  workflow_call:
    inputs:
      scope: { type: string, required: false, default: automatic }
  workflow_dispatch:
    inputs:
      scope:
        description: Applications to deploy after infrastructure reconciliation.
        type: choice
        required: true
        default: all
        options: [all, infrastructure, api, maps, mapshot, auth]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      environment: ${{ steps.scope.outputs.environment }}
      deploy-api: ${{ steps.scope.outputs.deploy-api }}
      deploy-maps: ${{ steps.scope.outputs.deploy-maps }}
      deploy-mapshot: ${{ steps.scope.outputs.deploy-mapshot }}
      promote-mapshot: ${{ steps.scope.outputs.promote-mapshot }}
      deploy-auth: ${{ steps.scope.outputs.deploy-auth }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - id: scope
        uses: ./.github/actions/resolve-deployment
        with: { scope: "${{ inputs.scope }}" }

  validate:
    needs: prepare
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - uses: ./.github/actions/setup-node-workspace
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_version: 1.12.6, tofu_wrapper: false }
      - uses: ./.github/actions/setup-mapshot-fonts
      - name: Run manual repository gate
        run: pnpm check

  infrastructure:
    needs: [prepare, validate]
    if: always() && !cancelled() && needs.prepare.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - uses: ./.github/actions/setup-node-workspace
      - name: Build shared application packages
        if: needs.prepare.outputs.deploy-api == 'true' || needs.prepare.outputs.deploy-maps == 'true' || needs.prepare.outputs.deploy-auth == 'true'
        run: pnpm build:packages
      - uses: ./.github/actions/reconcile-infrastructure
        with: { environment: "${{ needs.prepare.outputs.environment }}", infisical-identity-id: "${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}", google-workload-identity-provider: "${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}" }
      - name: Validate Maps runtime secret before application deployment
        if: needs.prepare.outputs.deploy-maps == 'true'
        uses: ./.github/actions/load-infisical-secrets
        with: { environment: "${{ needs.prepare.outputs.environment }}", profile: maps-runtime, infisical-identity-id: "${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}" }
      - name: Clear preflight Maps runtime secret
        if: always() && needs.prepare.outputs.deploy-maps == 'true'
        shell: ruby {0}
        run: |
          File.open(ENV.fetch("GITHUB_ENV"), "a") do |file|
            %w[GOOGLE_PLACES_API_KEY STATIC_MAP_LOCATION_SIGNING_KEY_BASE64URL].each { |name| file.puts "#{name}=" }
          end

  mapshot:
    needs: [prepare, infrastructure]
    if: always() && !cancelled() && needs.infrastructure.result == 'success' && needs.prepare.outputs.deploy-mapshot == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mapshot-release.yml
    with:
      environment: ${{ needs.prepare.outputs.environment }}
      revision: ${{ github.sha }}
      promote: ${{ needs.prepare.outputs.promote-mapshot == 'true' }}

  deploy:
    needs: [prepare, infrastructure, mapshot]
    if: always() && !cancelled() && needs.infrastructure.result == 'success' && (needs.mapshot.result == 'success' || needs.mapshot.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - uses: ./.github/actions/setup-node-workspace
      - name: Build shared application packages
        if: needs.prepare.outputs.deploy-api == 'true' || needs.prepare.outputs.deploy-maps == 'true' || needs.prepare.outputs.deploy-auth == 'true'
        run: pnpm build:packages
      - name: Validate and apply migrations
        if: needs.prepare.outputs.deploy-api == 'true'
        uses: ./.github/actions/neon-migrations
        with: { environment: "${{ needs.prepare.outputs.environment }}", infisical-identity-id: "${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}" }
      - name: Validate and apply Auth migrations
        if: needs.prepare.outputs.deploy-auth == 'true'
        uses: ./.github/actions/neon-migrations
        with: { environment: "${{ needs.prepare.outputs.environment }}", application: auth, infisical-identity-id: "${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}" }
      - name: Deploy Auth
        if: needs.prepare.outputs.deploy-auth == 'true'
        uses: ./.github/actions/deploy-auth
        with: { environment: "${{ needs.prepare.outputs.environment }}", infisical-identity-id: "${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}" }
      - name: Deploy Maps
        if: needs.prepare.outputs.deploy-maps == 'true'
        uses: ./.github/actions/deploy-maps
        with: { environment: "${{ needs.prepare.outputs.environment }}", infisical-identity-id: "${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}" }
      - name: Deploy API
        if: needs.prepare.outputs.deploy-api == 'true'
        uses: ./.github/actions/deploy-api
        with: { environment: "${{ needs.prepare.outputs.environment }}", infisical-identity-id: "${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}" }
