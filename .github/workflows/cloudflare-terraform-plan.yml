name: Cloudflare Terraform Plan

on:
  workflow_call:
    inputs:
      component:
        description: Registered Cloudflare Terraform component to plan
        required: true
        type: string
      environment:
        description: Persistent environment whose Cloudflare infrastructure is being planned
        required: true
        type: string
      mode:
        description: Whether to validate locally, show a speculative plan, save an apply plan, or detect drift
        required: true
        type: string
      plan_artifact_name:
        description: Artifact name used only when mode is saved
        required: false
        default: ''
        type: string
    secrets:
      CLOUDFLARE_TERRAFORM_READ_API_TOKEN:
        required: false
      TERRAFORM_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: ${{ inputs.component }} / ${{ inputs.mode }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_READ_API_TOKEN }}
      TERRAFORM_ROOT: infra/cloudflare/${{ inputs.component }}
      TF_CLOUD_ORGANIZATION: ${{ vars.HCP_TERRAFORM_ORGANIZATION }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_cloudflare_account_id: ${{ inputs.environment == 'production' && vars.CLOUDFLARE_PRODUCTION_ACCOUNT_ID || vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_WORKSPACE: cataqui-api-${{ inputs.component }}-${{ inputs.environment }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the pinned Terraform version
        id: terraform-version
        run: |
          terraform_version="$(tr -d '[:space:]' < infra/cloudflare/.terraform-version)"

          if [[ ! "$terraform_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "infra/cloudflare/.terraform-version must contain a semantic version such as 1.15.8" >&2
            exit 1
          fi

          echo "version=$terraform_version" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          cli_config_credentials_token: ${{ secrets.TERRAFORM_API_TOKEN }}
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@c750028ac0f3831886a261f96da68ab58a92e7ec # v6
        with:
          cache: true
          tflint_config_path: infra/cloudflare/.tflint.hcl
          tflint_version: v0.64.0

      - name: Verify the requested operation
        env:
          TERRAFORM_PLAN_MODE: ${{ inputs.mode }}
          TERRAFORM_PLAN_ARTIFACT_NAME: ${{ inputs.plan_artifact_name }}
          TERRAFORM_COMPONENT: ${{ inputs.component }}
          TERRAFORM_TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ ! "$TERRAFORM_COMPONENT" =~ ^[a-z0-9-]+$ || ! -f "$TERRAFORM_ROOT/versions.tf" ]]; then
            echo "component must identify a registered Terraform root under infra/cloudflare" >&2
            exit 1
          fi

          if ! jq --exit-status --arg component "$TERRAFORM_COMPONENT" 'index($component) != null' infra/cloudflare/components.json > /dev/null; then
            echo "component must be listed in infra/cloudflare/components.json" >&2
            exit 1
          fi

          if [[ "$TERRAFORM_TARGET_ENVIRONMENT" != "staging" && "$TERRAFORM_TARGET_ENVIRONMENT" != "production" ]]; then
            echo "environment must be staging or production" >&2
            exit 1
          fi

          if [[ "$TERRAFORM_PLAN_MODE" != "validate" && "$TERRAFORM_PLAN_MODE" != "speculative" && "$TERRAFORM_PLAN_MODE" != "saved" && "$TERRAFORM_PLAN_MODE" != "drift" ]]; then
            echo "mode must be validate, speculative, saved, or drift" >&2
            exit 1
          fi

          if [[ "$TERRAFORM_PLAN_MODE" == "saved" && -z "$TERRAFORM_PLAN_ARTIFACT_NAME" ]]; then
            echo "plan_artifact_name is required when mode is saved" >&2
            exit 1
          fi

          if [[ "$TERRAFORM_PLAN_MODE" != "saved" && -n "$TERRAFORM_PLAN_ARTIFACT_NAME" ]]; then
            echo "plan_artifact_name must be empty unless mode is saved" >&2
            exit 1
          fi

      - name: Verify Terraform formatting
        run: terraform fmt -check -recursive infra/cloudflare

      - name: Initialize Terraform without remote state
        if: inputs.mode == 'validate'
        run: terraform init -backend=false -input=false
        working-directory: ${{ env.TERRAFORM_ROOT }}

      - name: Initialize Terraform and the HCP workspace
        if: inputs.mode != 'validate'
        run: terraform init -input=false
        working-directory: ${{ env.TERRAFORM_ROOT }}

      - name: Validate the Terraform configuration
        run: terraform validate
        working-directory: ${{ env.TERRAFORM_ROOT }}

      - name: Initialize TFLint plugins
        run: tflint --chdir=infra/cloudflare --config="$GITHUB_WORKSPACE/infra/cloudflare/.tflint.hcl" --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify Terraform conventions
        run: tflint --chdir=infra/cloudflare --config="$GITHUB_WORKSPACE/infra/cloudflare/.tflint.hcl" --recursive --format compact

      - name: Verify Terraform behavior
        run: terraform test
        working-directory: ${{ env.TERRAFORM_ROOT }}

      - name: Show the proposed infrastructure changes
        if: inputs.mode == 'speculative'
        run: terraform plan -input=false -lock-timeout=5m -no-color
        working-directory: ${{ env.TERRAFORM_ROOT }}

      - name: Save the exact infrastructure changes for protected apply
        if: inputs.mode == 'saved'
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
        working-directory: ${{ env.TERRAFORM_ROOT }}

      - name: Add the saved plan to the workflow summary
        if: inputs.mode == 'saved'
        run: terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
        working-directory: ${{ env.TERRAFORM_ROOT }}

      - name: Retain the exact plan until the protected apply finishes
        if: inputs.mode == 'saved'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ env.TERRAFORM_ROOT }}/tfplan
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Fail when managed Cloudflare infrastructure has drifted
        if: inputs.mode == 'drift'
        working-directory: ${{ env.TERRAFORM_ROOT }}
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false -lock-timeout=5m -no-color
          terraform_exit_code=$?
          set -e

          if [[ "$terraform_exit_code" -eq 2 ]]; then
            echo "### Cloudflare ${{ inputs.component }} drift detected for $TF_VAR_environment" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          exit "$terraform_exit_code"
