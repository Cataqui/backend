name: Mapshot release
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      revision: { type: string, required: true }
      refresh: { type: boolean, default: false }
      promote: { type: boolean, default: false }
permissions:
  contents: read
concurrency:
  group: mapshot-release
  cancel-in-progress: false
  queue: max
jobs:
  release-transfer:
    permissions:
      contents: read
      id-token: write
    outputs:
      source-ready: ${{ steps.transfer.outputs.source-ready }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.revision }}", persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - uses: ./.github/actions/setup-node-workspace
        with: { generate-clients: 'false' }
      - uses: ./.github/actions/deploy-mapshot
        id: transfer
        with:
          infisical-identity-id: ${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}
          environment: ${{ inputs.environment }}
          revision: ${{ inputs.revision }}
          operation: transfer
          refresh: ${{ inputs.refresh }}
          promote: ${{ inputs.promote }}
  release-verify:
    permissions:
      contents: read
      id-token: write
    needs: release-transfer
    if: needs.release-transfer.outputs.source-ready != 'true'
    outputs:
      source-ready: ${{ steps.verify.outputs.source-ready }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.revision }}", persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - uses: ./.github/actions/setup-node-workspace
        with: { generate-clients: 'false' }
      - uses: ./.github/actions/deploy-mapshot
        id: verify
        with:
          infisical-identity-id: ${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}
          environment: ${{ inputs.environment }}
          revision: ${{ inputs.revision }}
          operation: verify
          refresh: ${{ inputs.refresh }}
          promote: ${{ inputs.promote }}
  release-prepare:
    permissions:
      contents: read
      id-token: write
    needs: [release-transfer, release-verify]
    if: needs.release-transfer.outputs.source-ready != 'true' && needs.release-verify.outputs.source-ready != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.revision }}", persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - uses: ./.github/actions/setup-node-workspace
        with: { generate-clients: 'false' }
      - uses: ./.github/actions/deploy-mapshot
        with:
          infisical-identity-id: ${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}
          environment: ${{ inputs.environment }}
          revision: ${{ inputs.revision }}
          operation: prepare
          refresh: ${{ inputs.refresh }}
          promote: ${{ inputs.promote }}
  release-deploy:
    permissions:
      contents: read
      id-token: write
    needs: [release-transfer, release-verify, release-prepare]
    if: always() && !cancelled() && needs.release-transfer.result == 'success' && (needs.release-verify.result == 'success' || needs.release-verify.result == 'skipped') && (needs.release-prepare.result == 'success' || needs.release-prepare.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.revision }}", persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - uses: ./.github/actions/setup-node-workspace
        with: { generate-clients: 'false' }
      - uses: ./.github/actions/deploy-mapshot
        with:
          infisical-identity-id: ${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}
          environment: ${{ inputs.environment }}
          revision: ${{ inputs.revision }}
          operation: deploy
          refresh: ${{ inputs.refresh }}
          promote: ${{ inputs.promote }}
  recover:
    permissions:
      contents: read
      id-token: write
    needs: release-deploy
    if: always() && (needs.release-deploy.result == 'failure' || needs.release-deploy.result == 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.revision }}', persist-credentials: false }
      - uses: ./.github/actions/setup-ruby-workspace
      - uses: ./.github/actions/setup-node-workspace
        with: { generate-clients: 'false' }
      - uses: ./.github/actions/deploy-mapshot
        with:
          infisical-identity-id: ${{ vars.INFISICAL_OPENTOFU_IDENTITY_ID }}
          environment: ${{ inputs.environment }}
          revision: ${{ inputs.revision }}
          operation: recover
