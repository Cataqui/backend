name: Deploy Production

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'prisma/**'
      - 'Dockerfile'
      - 'wrangler.jsonc'
      - 'pnpm-lock.yaml'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate (Production)
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Create Neon test branch
        id: neon-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: production-deploy-${{ github.run_id }}
          parent_branch: production
          database: cataqui-production
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Test migrations on branch
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_DIRECT_URL: ${{ steps.neon-branch.outputs.db_url }}

      - name: Run database migrations
        if: success()
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}

      - name: Cleanup Neon test branch
        if: always() && steps.neon-branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ${{ steps.neon-branch.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

  deploy:
    name: Deploy (Production)
    runs-on: ubuntu-latest
    needs: migrate
    environment:
      name: production
      url: https://api.cataqui.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
          environment: production
          secrets: |
            DATABASE_POOLER_URL
            DATABASE_DIRECT_URL
            CORS_ORIGINS
        env:
          DATABASE_POOLER_URL: ${{ secrets.DATABASE_POOLER_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
