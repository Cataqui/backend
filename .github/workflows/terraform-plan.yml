name: Terraform Validate

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'infrastructure/**'
      - 'apps/api/wrangler.jsonc'
      - 'apps/workers/*/wrangler.jsonc'
      - '.github/dependabot.yml'
      - '.github/actions/**'
      - '.github/workflows/cloudflare-terraform-components-validate.yml'
      - '.github/workflows/cloudflare-terraform-validate.yml'
      - '.github/workflows/neon-terraform-validate.yml'
      - '.github/workflows/terraform-plan.yml'
      - '.github/workflows/terraform-drift.yml'
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/deploy-production.yml'

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-cloudflare:
    name: Validate Cloudflare infrastructure without credentials
    uses: ./.github/workflows/cloudflare-terraform-components-validate.yml

  validate-upstash:
    name: Validate Upstash infrastructure without credentials
    uses: ./.github/workflows/upstash-terraform-validate.yml

  validate-neon:
    name: Validate Neon infrastructure without credentials
    uses: ./.github/workflows/neon-terraform-validate.yml
