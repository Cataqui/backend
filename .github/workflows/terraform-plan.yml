name: Terraform Plan

on:
  pull_request:
    branches: [development, staging, main]
    paths:
      - 'infra/**'
      - 'wrangler.jsonc'
      - '.github/dependabot.yml'
      - '.github/actions/**'
      - '.github/workflows/cloudflare-terraform-apply.yml'
      - '.github/workflows/cloudflare-terraform-components-apply.yml'
      - '.github/workflows/cloudflare-terraform-components-plan.yml'
      - '.github/workflows/cloudflare-terraform-plan.yml'
      - '.github/workflows/terraform-plan.yml'
      - '.github/workflows/terraform-drift.yml'
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/deploy-production.yml'

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Cloudflare infrastructure without credentials
    uses: ./.github/workflows/cloudflare-terraform-components-plan.yml
    with:
      environment: staging
      mode: validate

  staging:
    name: Plan staging Cloudflare infrastructure with read-only access
    needs: validate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.base.ref == 'development' || github.event.pull_request.base.ref == 'staging')
    uses: ./.github/workflows/cloudflare-terraform-components-plan.yml
    with:
      environment: staging
      mode: speculative
    secrets:
      TERRAFORM_API_TOKEN: ${{ secrets.TERRAFORM_API_TOKEN }}

  production:
    name: Plan production Cloudflare infrastructure with read-only access
    needs: validate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    uses: ./.github/workflows/cloudflare-terraform-components-plan.yml
    with:
      environment: production
      mode: speculative
    secrets:
      TERRAFORM_API_TOKEN: ${{ secrets.TERRAFORM_API_TOKEN }}
