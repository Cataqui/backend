name: Cloudflare Terraform Apply

on:
  workflow_call:
    inputs:
      component:
        description: Registered Cloudflare Terraform component whose saved plan is being applied
        required: true
        type: string
      environment:
        description: Protected environment whose saved Cloudflare plan is being applied
        required: true
        type: string
      plan_artifact_name:
        description: Name of the exact saved plan artifact produced earlier in this workflow run
        required: true
        type: string
    secrets:
      CLOUDFLARE_TERRAFORM_WRITE_API_TOKEN:
        description: Environment-scoped Cloudflare token with write access to registered Terraform components
        required: false
      TERRAFORM_API_TOKEN:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  validate-inputs:
    name: Validate apply target
    runs-on: ubuntu-latest
    steps:
      - name: Check out the deployment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject unsupported apply targets
        env:
          TERRAFORM_PLAN_ARTIFACT_NAME: ${{ inputs.plan_artifact_name }}
          TERRAFORM_COMPONENT: ${{ inputs.component }}
          TERRAFORM_TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ ! "$TERRAFORM_COMPONENT" =~ ^[a-z0-9-]+$ ]]; then
            echo "component must contain only lowercase letters, digits, and hyphens" >&2
            exit 1
          fi

          if ! jq --exit-status --arg component "$TERRAFORM_COMPONENT" 'index($component) != null' infra/cloudflare/components.json > /dev/null; then
            echo "component must be listed in infra/cloudflare/components.json" >&2
            exit 1
          fi

          if [[ "$TERRAFORM_TARGET_ENVIRONMENT" != "staging" && "$TERRAFORM_TARGET_ENVIRONMENT" != "production" ]]; then
            echo "environment must be staging or production" >&2
            exit 1
          fi

          if [[ -z "$TERRAFORM_PLAN_ARTIFACT_NAME" ]]; then
            echo "plan_artifact_name is required" >&2
            exit 1
          fi

  apply:
    name: Apply ${{ inputs.component }} plan (${{ inputs.environment }})
    needs: validate-inputs
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_WRITE_API_TOKEN }}
      TERRAFORM_ROOT: infra/cloudflare/${{ inputs.component }}
      TF_CLOUD_ORGANIZATION: ${{ vars.HCP_TERRAFORM_ORGANIZATION }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_cloudflare_account_id: ${{ inputs.environment == 'production' && vars.CLOUDFLARE_PRODUCTION_ACCOUNT_ID || vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_WORKSPACE: cataqui-api-${{ inputs.component }}-${{ inputs.environment }}
    steps:
      - name: Check out the deployment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the pinned Terraform version
        id: terraform-version
        run: |
          terraform_version="$(tr -d '[:space:]' < infra/cloudflare/.terraform-version)"

          if [[ ! "$terraform_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "infra/cloudflare/.terraform-version must contain a semantic version such as 1.15.8" >&2
            exit 1
          fi

          echo "version=$terraform_version" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          cli_config_credentials_token: ${{ secrets.TERRAFORM_API_TOKEN }}
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Download the exact saved plan from this deployment run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ env.TERRAFORM_ROOT }}

      - name: Initialize Terraform and the HCP workspace
        run: terraform init -input=false
        working-directory: ${{ env.TERRAFORM_ROOT }}

      - name: Apply the exact saved infrastructure changes
        run: terraform apply -input=false -lock-timeout=5m tfplan
        working-directory: ${{ env.TERRAFORM_ROOT }}
