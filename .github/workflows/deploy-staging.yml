name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'infra/**'
      - 'Dockerfile'
      - 'wrangler.jsonc'
      - 'pnpm-lock.yaml'
      - '.github/actions/**'
      - '.github/workflows/deploy-staging.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  infrastructure-components:
    name: Discover Cloudflare infrastructure components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.registry.outputs.components }}
    steps:
      - name: Check out the deployment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Discover registered Terraform components
        id: registry
        uses: ./.github/actions/discover-cloudflare-terraform-components

  infrastructure:
    name: Deploy ${{ matrix.component }} Cloudflare infrastructure (Staging)
    needs: infrastructure-components
    runs-on: ubuntu-latest
    environment:
      name: staging
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.infrastructure-components.outputs.components) }}
    env:
      TERRAFORM_ROOT: infra/cloudflare/${{ matrix.component }}
      TF_CLOUD_ORGANIZATION: ${{ vars.HCP_TERRAFORM_ORGANIZATION }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      TF_VAR_environment: staging
      TF_WORKSPACE: cataqui-api-${{ matrix.component }}-staging
    steps:
      - name: Check out the deployment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy the registered Terraform component
        uses: ./.github/actions/deploy-cloudflare-terraform-component
        with:
          component: ${{ matrix.component }}
          environment: staging
          terraform-api-token: ${{ secrets.TERRAFORM_API_TOKEN }}
          cloudflare-read-api-token: ${{ secrets.CLOUDFLARE_TERRAFORM_READ_API_TOKEN }}
          cloudflare-write-api-token: ${{ secrets.CLOUDFLARE_TERRAFORM_WRITE_API_TOKEN }}

  migrate:
    name: Migrate (Staging)
    runs-on: ubuntu-latest
    needs: infrastructure
    environment:
      name: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Create Neon test branch
        id: neon-branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: staging-deploy-${{ github.run_id }}
          parent_branch: staging
          database: cataqui-staging
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Test migrations on branch
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_DIRECT_URL: ${{ steps.neon-branch.outputs.db_url }}

      - name: Run database migrations
        if: success()
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}

      - name: Cleanup Neon test branch
        if: always() && steps.neon-branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ${{ steps.neon-branch.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

  deploy:
    name: Deploy (Staging)
    runs-on: ubuntu-latest
    needs: migrate
    environment:
      name: staging
      url: https://staging.api.cataqui.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
          environment: staging
          secrets: |
            DATABASE_POOLER_URL
            DATABASE_DIRECT_URL
            PROTOMAP_AUTH_SECRET
            AI_GATEWAY_API_TOKEN
        env:
          DATABASE_POOLER_URL: ${{ secrets.DATABASE_POOLER_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          PROTOMAP_AUTH_SECRET: ${{ secrets.PROTOMAP_AUTH_SECRET }}
          AI_GATEWAY_API_TOKEN: ${{ secrets.AI_GATEWAY_API_TOKEN }}
