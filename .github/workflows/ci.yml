name: CI

on:
  push:
    branches: [staging, main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'infra/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nest-cli.json'
      - 'tsconfig.json'
      - 'test/**'
      - '.github/actions/**'
      - '.github/workflows/**'
  pull_request:
    branches: [staging, main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'infra/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nest-cli.json'
      - 'tsconfig.json'
      - 'test/**'
      - '.github/actions/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate
        env:
          DATABASE_OWNER_DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Lint
        run: pnpm lint:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:cov
        env:
          CORS_ORIGINS: http://localhost:3000

      - name: Build
        run: pnpm build
