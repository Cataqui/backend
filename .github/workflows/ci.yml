name: CI

on:
  push:
    branches: [staging, main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - 'test/**'
      - '.agents/skills/**'
      - '.github/**'
      - '.husky/**'
      - 'docs/**'
      - '**/AGENTS.md'
      - '*.md'
      - '*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'skills-lock.json'
      - 'biome.json'
      - 'tsconfig*.json'
      - 'vitest*.ts'
      - '.dockerignore'
      - '.editorconfig'
      - '.env.example'
      - '.gitattributes'
      - '.gitignore'
      - '.ignore'
      - '.npmrc'
      - 'LICENSE'
  pull_request:
    branches: [staging, main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - 'test/**'
      - '.agents/skills/**'
      - '.github/**'
      - '.husky/**'
      - 'docs/**'
      - '**/AGENTS.md'
      - '*.md'
      - '*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'skills-lock.json'
      - 'biome.json'
      - 'tsconfig*.json'
      - 'vitest*.ts'
      - '.dockerignore'
      - '.editorconfig'
      - '.env.example'
      - '.gitattributes'
      - '.gitignore'
      - '.ignore'
      - '.npmrc'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected_scope:
    name: Resolve affected backend scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
      skills_changed: ${{ steps.scope.outputs.skills_changed }}
      validate_repository: ${{ steps.scope.outputs.validate_repository }}
      validate_infrastructure: ${{ steps.scope.outputs.validate_infrastructure }}
      validation_workspaces: ${{ steps.scope.outputs.validation_workspaces }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve changed paths and dependent workspaces
        id: scope
        env:
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          head_sha="$EVENT_HEAD_SHA"
          base_sha="$EVENT_BEFORE_SHA"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PULL_REQUEST_BASE_SHA"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git hash-object -t tree /dev/null)"
          fi

          {
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

          if git diff --quiet "$base_sha" "$head_sha" -- \
            skills-lock.json \
            .agents/skills; then
            echo "skills_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "skills_changed=true" >> "$GITHUB_OUTPUT"
          fi

          git diff --check "$base_sha" "$head_sha"
          node scripts/affected-workspaces.mjs \
            --base "$base_sha" \
            --head "$head_sha" \
            --github-output

  repository:
    name: Repository and root skill checks
    needs: affected_scope
    if: >-
      ${{
        needs.affected_scope.outputs.validate_repository == 'true' ||
        needs.affected_scope.outputs.validate_infrastructure == 'true' ||
        needs.affected_scope.outputs.validation_workspaces != '[]'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint the repository
        run: pnpm lint:check

      - name: Validate repository contracts
        if: >-
          ${{
            needs.affected_scope.outputs.validate_repository == 'true' ||
            needs.affected_scope.outputs.validate_infrastructure == 'true'
          }}
        run: pnpm test:repo

      - name: Validate the root skill registry
        if: needs.affected_scope.outputs.skills_changed == 'true'
        run: jq empty skills-lock.json

      - name: Restore skills from the root registry
        if: needs.affected_scope.outputs.skills_changed == 'true'
        run: pnpm skills:install

      - name: Verify skill restoration leaves registries unchanged
        if: needs.affected_scope.outputs.skills_changed == 'true'
        run: git diff --exit-code -- skills-lock.json .agents/skills

  workspace:
    name: Validate ${{ matrix.workspace }}
    needs: affected_scope
    if: needs.affected_scope.outputs.validation_workspaces != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.affected_scope.outputs.validation_workspaces) }}
    env:
      CORS_ORIGINS: http://localhost:3000
      DATABASE_OWNER_DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace and dependencies
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: pnpm --filter "$WORKSPACE..." run build

      - name: Typecheck workspace
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: pnpm --filter "$WORKSPACE" run typecheck

      - name: Test workspace with coverage
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: pnpm --filter "$WORKSPACE" run test:cov
