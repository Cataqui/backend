name: CI

on:
  push:
    branches: [staging, main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'infra/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nest-cli.json'
      - 'tsconfig.json'
      - 'test/**'
      - '.github/actions/**'
      - '.github/workflows/**'
  pull_request:
    branches: [staging, main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'infra/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nest-cli.json'
      - 'tsconfig.json'
      - 'test/**'
      - '.github/actions/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate
        env:
          DATABASE_OWNER_DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Lint
        run: pnpm lint:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:cov
        env:
          CORS_ORIGINS: http://localhost:3000

      - name: Build
        run: pnpm build
