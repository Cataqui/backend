name: CI

on:
  push:
    branches: [staging, main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [staging, main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  validate:
    name: Validate applications and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby automation
        uses: ./.github/actions/setup-ruby-workspace

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Check formatting and linting
        run: pnpm lint:check

      - name: Validate OpenTofu roots
        run: pnpm check:opentofu

      - name: Type-check every workspace
        run: pnpm typecheck

      - name: Set up Mapshot font tooling
        uses: ./.github/actions/setup-mapshot-fonts

      - name: Run coverage gates
        run: pnpm test:cov

      - name: Build applications and packages
        run: pnpm build

  deploy:
    name: Deploy validated commit
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    needs: validate
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      scope: automatic
