name: CI

on:
  push:
    branches: [development, staging, main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'infra/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'test/**'
      - '.github/actions/**'
      - '.github/workflows/**'
  pull_request:
    branches: [development, staging, main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'infra/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'test/**'
      - '.github/actions/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate
        env:
          DATABASE_DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          CORS_ORIGINS: http://localhost:3000
