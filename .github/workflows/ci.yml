name: CI

on:
  push:
    branches: [staging, main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [staging, main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate applications and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: pnpm lint:check

      - name: Validate OpenTofu roots
        run: pnpm check:opentofu

      - name: Type-check every workspace
        run: pnpm typecheck

      - name: Run coverage gates
        run: pnpm test:cov

      - name: Build applications and packages
        run: pnpm build

  deploy:
    name: Deploy validated commit
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    needs: validate
    permissions:
      contents: read
      deployments: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      scope: automatic
