name: CI

on:
  push:
    branches: [staging, main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [staging, main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  validate:
    name: Validate applications and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Ruby automation
        uses: ./.github/actions/setup-ruby-workspace

      - name: Set up Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Select affected workspaces and infrastructure
        id: scope
        shell: ruby {0}
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: load ".github/scripts/ci/get-validation-scope.rb"

      - name: Set up OpenTofu
        if: steps.scope.outputs.infrastructure == 'true'
        uses: ./.github/actions/setup-opentofu

      - name: Check formatting and linting
        run: pnpm lint:check

      - name: Validate OpenTofu roots
        if: steps.scope.outputs.infrastructure == 'true'
        run: pnpm check:opentofu

      - name: Check renderer dependency advisories and licenses before deployment
        if: steps.scope.outputs.renderer == 'true'
        uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          manifest-path: apps/mapshot/renderer/Cargo.toml
          arguments: --locked

      - name: Set up Mapshot font tooling
        if: steps.scope.outputs.mapshot == 'true'
        uses: ./.github/actions/setup-mapshot-fonts

      - name: Build shared contracts for workspace and binding types
        if: steps.scope.outputs.workspaces != '[]' || steps.scope.outputs.repository == 'true'
        run: pnpm build:contracts

      - name: Type-check affected workspaces
        env:
          VALIDATION_WORKSPACES: ${{ steps.scope.outputs.workspaces }}
        run: ruby .github/scripts/ci/validate-workspaces.rb typecheck

      - name: Check repository architecture and deployment configuration contracts
        if: steps.scope.outputs.repository == 'true'
        run: pnpm exec vitest run --config vitest.config.ts

      - name: Run infrastructure bootstrap coverage gates
        if: steps.scope.outputs.bootstrap == 'true'
        run: bundle exec rake -C infrastructure/bootstrap coverage

      - name: Run affected workspace coverage gates
        env:
          VALIDATION_WORKSPACES: ${{ steps.scope.outputs.workspaces }}
        run: ruby .github/scripts/ci/validate-workspaces.rb test:cov

      - name: Build affected applications and packages
        env:
          VALIDATION_WORKSPACES: ${{ steps.scope.outputs.build-workspaces }}
        run: ruby .github/scripts/ci/validate-workspaces.rb build

      - name: Check affected compiled Workers in their real runtime
        env:
          VALIDATION_WORKSPACES: ${{ steps.scope.outputs.workspaces }}
        run: ruby .github/scripts/ci/validate-workspaces.rb test:runtime

  deploy:
    name: Deploy validated commit
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    needs: validate
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      scope: automatic
