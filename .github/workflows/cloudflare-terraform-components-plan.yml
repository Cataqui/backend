name: Cloudflare Terraform Components Plan

on:
  workflow_call:
    inputs:
      environment:
        description: Persistent environment whose registered Cloudflare components are being planned
        required: true
        type: string
      mode:
        description: Whether to validate locally, show a speculative plan, save an apply plan, or detect drift
        required: true
        type: string
      artifact_suffix:
        description: Immutable suffix for saved component plan artifacts
        required: false
        default: ''
        type: string
    secrets:
      TERRAFORM_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover registered Terraform components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.registry.outputs.components }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Discover registered Terraform components
        id: registry
        uses: ./.github/actions/discover-cloudflare-terraform-components

  validate-modules:
    name: Validate reusable Terraform modules
    if: inputs.mode == 'validate'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the pinned Terraform version
        id: terraform-version
        run: |
          terraform_version="$(tr -d '[:space:]' < infra/cloudflare/.terraform-version)"

          if [[ ! "$terraform_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "infra/cloudflare/.terraform-version must contain a semantic version such as 1.15.8" >&2
            exit 1
          fi

          echo "version=$terraform_version" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Verify every reusable module with tests
        run: |
          for module_directory in infra/cloudflare/modules/*; do
            if [[ ! -d "$module_directory/tests" ]]; then
              continue
            fi

            terraform -chdir="$module_directory" init -backend=false -input=false
            terraform -chdir="$module_directory" validate
            terraform -chdir="$module_directory" test
          done

  plan:
    name: Plan registered Cloudflare components
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.discover.outputs.components) }}
    uses: ./.github/workflows/cloudflare-terraform-plan.yml
    with:
      component: ${{ matrix.component }}
      environment: ${{ inputs.environment }}
      mode: ${{ inputs.mode }}
      plan_artifact_name: ${{ inputs.mode == 'saved' && format('cloudflare-{0}-{1}-{2}', matrix.component, inputs.environment, inputs.artifact_suffix) || '' }}
    secrets:
      TERRAFORM_API_TOKEN: ${{ secrets.TERRAFORM_API_TOKEN }}
