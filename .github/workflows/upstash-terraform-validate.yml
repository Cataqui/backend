name: Upstash Terraform Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-upstash:
    name: Upstash Redis / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TERRAFORM_ROOT: infra/upstash/redis
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Terraform version
        id: terraform-version
        run: |
          terraform_version="$(tr -d '[:space:]' < infra/upstash/.terraform-version)"

          if [[ ! "$terraform_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "infra/upstash/.terraform-version must contain a semantic version such as 1.15.8" >&2
            exit 1
          fi

          echo "version=$terraform_version" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6
        with:
          cache: true
          tflint_config_path: infra/upstash/.tflint.hcl
          tflint_version: v0.64.0

      - name: Verify Terraform formatting
        run: terraform fmt -check -recursive infra/upstash

      - name: Initialize Terraform without remote state
        run: terraform init -backend=false -input=false
        working-directory: ${{ env.TERRAFORM_ROOT }}

      - name: Validate the Terraform configuration
        run: terraform validate
        working-directory: ${{ env.TERRAFORM_ROOT }}

      - name: Initialize TFLint plugins
        run: tflint --chdir=infra/upstash --config="$GITHUB_WORKSPACE/infra/upstash/.tflint.hcl" --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify Terraform conventions
        run: tflint --chdir=infra/upstash --config="$GITHUB_WORKSPACE/infra/upstash/.tflint.hcl" --recursive --format compact

      - name: Verify Terraform behavior
        run: terraform test
        working-directory: ${{ env.TERRAFORM_ROOT }}
